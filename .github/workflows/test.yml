name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Install and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm install

      - name: Start game server
        run: python3 -m http.server 8080 > /tmp/piggy-http.log 2>&1 &

      - name: Wait for game server
        run: |
          for i in {1..20}; do
            curl --fail --silent http://127.0.0.1:8080/index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/piggy-http.log
          exit 1

      - name: Run test suite
        run: npm test
