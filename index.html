<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>豬豬夢工場：30天豬生逆襲</title>
<meta name="description" content="30 天把一隻普通小粉豬養成傳奇豬豬！繁體中文養成模擬網頁遊戲，支援加到主畫面（PWA），串接 Gemini 產生突發事件與結局報導。">
<meta name="theme-color" content="#8b5a2b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="豬豬夢工場">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* ===== 基本設定 ===== */
:root{
  --paper:#fff3c4; --ink:#4a3320;
  --wood1:#9a6a3a; --wood2:#7f5329; --wood-dark:#4b2f14;
  --green:#6cc04a; --yellow:#f5c542; --red:#e8584f; --blue:#4c9be8; --pink:#f06fa0; --orange:#f08a3c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  color:var(--ink);
  background-color:#8fd16b;
  background-image:radial-gradient(#7cc15a 2px,transparent 2.5px);
  background-size:24px 24px;
  line-height:1.5;
}
button{font-family:inherit}
#app{max-width:1100px;margin:0 auto;padding:10px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}

/* ===== 木頭質感邊框 ===== */
.wood{
  background:repeating-linear-gradient(92deg,#9a6a3a 0 7px,#8a5c2f 7px 9px,#a3733f 9px 17px,#7f5329 17px 18px);
  border-radius:14px;padding:10px;
  box-shadow:inset 0 0 0 2px #5e3b1b,inset 0 0 0 4px rgba(255,220,160,.25),0 5px 0 var(--wood-dark),0 8px 14px rgba(0,0,0,.25);
}

/* ===== 頂部列 ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;padding:8px 12px}
.topbar h1{margin:0;font-size:1.25rem;color:#fff3c4;text-shadow:2px 2px 0 #4b2f14;letter-spacing:1px;line-height:1.2}
.topbar h1 small{display:block;font-size:.72rem;color:#ffe29a;letter-spacing:0;font-weight:600}
.topbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tbtn{border:2px solid var(--wood-dark);background:#fff3c4;color:var(--ink);border-radius:8px;padding:5px 9px;font-size:.85rem;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--wood-dark)}
.tbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood-dark)}

/* ===== 版面：左邊豬豬、右邊筆記本 ===== */
.layout{display:grid;grid-template-columns:minmax(300px,430px) 1fr;gap:16px;align-items:start}
.stage{position:sticky;top:10px}
@media (max-width:780px){
  .layout{grid-template-columns:1fr}
  .stage{position:static}
  .topbar h1{font-size:1.05rem}
}

/* ===== 豬豬舞台 ===== */
.stage-view{position:relative}
#pigSvg{width:100%;height:auto;display:block;border:3px solid var(--wood-dark);border-radius:10px;background:#bfe9ff}
.badges{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:5px;align-items:flex-end;z-index:2}
.badge{background:#fff8dc;border:3px solid var(--wood-dark);border-radius:8px;padding:1px 9px;font-weight:800;font-size:.95rem;box-shadow:0 3px 0 var(--wood-dark)}
.bubble{
  position:absolute;left:10px;top:10px;max-width:56%;z-index:2;
  background:#fff;border:3px solid var(--wood-dark);border-radius:12px;padding:5px 10px;font-size:.85rem;font-weight:700;
  box-shadow:0 3px 0 rgba(75,47,20,.6);
}
.bubble::after{content:"";position:absolute;left:26px;bottom:-12px;border:6px solid transparent;border-top:9px solid var(--wood-dark)}
.pigtag{
  display:inline-block;margin:10px 0 8px;padding:3px 12px;border:3px solid var(--wood-dark);border-radius:6px;
  background:#ffe29a;font-weight:900;box-shadow:0 3px 0 var(--wood-dark)
}
.stats{background:#fff3c4;border:3px solid #5e3b1b;border-radius:10px;padding:8px 10px}
.stat{display:grid;grid-template-columns:76px 1fr 74px;align-items:center;gap:8px;padding:3px 0}
.stat .lbl{font-weight:800;font-size:.9rem;white-space:nowrap}
.bar{position:relative;height:16px;background:#d9c79a;border:2px solid #5e3b1b;border-radius:5px;overflow:hidden}
.fill{position:relative;height:100%;width:0;transition:width .5s ease,background .3s}
.fill::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(255,255,255,.28) 6px 8px)}
.val{position:relative;font-weight:800;font-size:.9rem;text-align:right;white-space:nowrap}
.delta{position:absolute;right:0;top:-14px;font-size:.85rem;font-weight:900;opacity:0;pointer-events:none}
.delta.show{animation:deltaPop 1.3s ease-out}
.delta.up{color:#2f8a1a}.delta.down{color:#c23a30}
@keyframes deltaPop{0%{opacity:0;transform:translateY(8px)}15%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}

/* ===== 筆記本 ===== */
.paper{
  position:relative;padding:14px 14px 16px 50px;border:3px solid #d9bd6a;border-radius:8px;background-color:var(--paper);
  background-image:
    repeating-linear-gradient(to bottom,transparent 0,transparent 27px,rgba(110,150,200,.33) 27px,rgba(110,150,200,.33) 28px),
    linear-gradient(90deg,transparent 36px,rgba(220,90,90,.45) 36px,rgba(220,90,90,.45) 38px,transparent 38px);
}
.paper::before{
  content:"";position:absolute;left:9px;top:12px;bottom:12px;width:16px;
  background:radial-gradient(circle at 8px 8px,#6b4a2b 0 5px,transparent 5.5px) 0 0/16px 30px repeat-y;
}
.paper h2{margin:0 0 10px;font-size:1.15rem}
.paper h3{margin:16px 0 6px;font-size:1rem}
.hint{font-size:.8rem;color:#7a6040;margin:2px 0 10px}

.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.act{
  text-align:left;padding:9px 10px;border:3px solid var(--wood-dark);border-radius:8px;background:#fffaf0;color:var(--ink);
  box-shadow:0 4px 0 var(--wood-dark);cursor:pointer;display:flex;flex-direction:column;gap:5px;font-size:1rem;
  transition:transform .06s,box-shadow .06s,background .15s;
}
.act:hover{background:#fff}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood-dark)}
.act:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.45)}
.act .name{font-weight:900}
.act.danger{border-color:#b3302a;box-shadow:0 4px 0 #b3302a}
.act .warn{font-size:.74rem;color:#b3302a;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:.72rem;padding:0 6px;border-radius:10px;border:1px solid;font-weight:800;white-space:nowrap}
.chip.up{background:#e3f7d8;border-color:#7cbf5a;color:#2f7a1a}
.chip.down{background:#fde4e1;border-color:#e58a82;color:#a3322a}
body.busy .act{pointer-events:none;opacity:.6}

.log{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto}
.log li{padding:3px 0;font-size:.88rem;border-bottom:1px dashed rgba(120,90,50,.3)}
.log .d{display:inline-block;min-width:3.4em;font-weight:900;color:#a06a2a}
.log li.ev{color:#7a2f8a}
.log li.bad{color:#b3302a}

/* ===== 彈窗 ===== */
.overlay{position:fixed;inset:0;background:rgba(40,25,10,.62);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:14px;padding:10px;
  background:repeating-linear-gradient(92deg,#9a6a3a 0 7px,#8a5c2f 7px 9px,#a3733f 9px 17px,#7f5329 17px 18px);
  box-shadow:inset 0 0 0 2px #5e3b1b,0 8px 0 var(--wood-dark),0 14px 30px rgba(0,0,0,.4);animation:pop .22s ease-out;
}
.modal.wide{width:min(760px,100%)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal-inner{background:var(--paper);border:3px solid #d9bd6a;border-radius:8px;padding:14px 16px}
.modal h2{margin:0 0 8px;font-size:1.25rem;text-align:center}
.modal .big{font-size:2.6rem;text-align:center;line-height:1.1}
.modal p{margin:6px 0}
.modal-btns{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.modal-btns.row{flex-direction:row;flex-wrap:wrap;justify-content:center}
.mbtn{
  border:3px solid var(--wood-dark);border-radius:8px;background:#fffaf0;color:var(--ink);padding:9px 12px;font-size:1rem;font-weight:800;
  cursor:pointer;box-shadow:0 4px 0 var(--wood-dark);text-align:left
}
.mbtn.center{text-align:center}
.mbtn.primary{background:#ffd95a}
.mbtn:hover{filter:brightness(1.05)}
.mbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood-dark)}
.spinner{width:38px;height:38px;border:5px solid #e0c080;border-top-color:#8b5a2e;border-radius:50%;animation:spin 1s linear infinite;margin:12px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.small{font-size:.8rem;color:#7a6040}
.tag-ai{display:inline-block;font-size:.7rem;padding:0 7px;border-radius:9px;background:#e7d7ff;color:#5a2d91;font-weight:800;margin-left:6px;vertical-align:middle}
.tag-local{background:#e0e0e0;color:#555}
.field{width:100%;padding:8px;border:2px solid #5e3b1b;border-radius:6px;font-size:1rem;background:#fff;margin:6px 0}

/* ===== 報紙 ===== */
.news{
  background:#f3e8c9;border:2px solid #3b3025;padding:10px 14px 14px;margin:8px 0;
  font-family:"Noto Serif TC","Songti TC","PMingLiU","Source Han Serif TC",serif;color:#2b2218;
  box-shadow:3px 3px 0 rgba(0,0,0,.2);transform:rotate(-.6deg)
}
.news .mast{text-align:center;font-size:1.7rem;font-weight:900;letter-spacing:.35em;border-bottom:4px double #3b3025;padding-bottom:4px}
.news .meta{display:flex;justify-content:space-between;font-size:.72rem;border-bottom:1px solid #3b3025;padding:3px 0;margin-bottom:8px}
.news .head{font-size:1.55rem;font-weight:900;line-height:1.25;margin:6px 0 2px}
.news .sub{font-size:.95rem;font-weight:700;margin-bottom:8px;color:#5a4630}
.news .body{font-size:.92rem;line-height:1.75;text-align:justify}
.news .body p{margin:0 0 6px;text-indent:2em}
.news .quote{margin-top:8px;padding:6px 10px;border-left:4px solid #3b3025;font-style:italic;background:rgba(0,0,0,.05)}

/* ===== 圖鑑 ===== */
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:8px}
.bcard{border:3px solid #5e3b1b;border-radius:8px;background:#fffaf0;padding:8px;text-align:center;font-size:.82rem}
.bcard .e{font-size:2rem}
.bcard .t{font-weight:900;font-size:.95rem}
.bcard.locked{background:#d8cdb0;color:#7a6a4a}
.bcard.locked .e{filter:grayscale(1) brightness(.5)}
.stars{color:#e0a000;letter-spacing:1px}

.endpig{width:min(220px,60%);margin:0 auto;display:block}
.endpig svg{width:100%;height:auto;border:3px solid var(--wood-dark);border-radius:10px;display:block}
.sumrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.sumrow span{background:#fff;border:2px solid #5e3b1b;border-radius:8px;padding:1px 8px;font-weight:800;font-size:.85rem}

.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#4b2f14;color:#fff3c4;padding:8px 16px;border-radius:20px;font-weight:700;z-index:80;box-shadow:0 4px 12px rgba(0,0,0,.35);max-width:90vw;text-align:center}

/* ===== 豬豬動畫 ===== */
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.03)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.4s infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.heart{animation:floatUp 2.6s ease-in infinite;transform-box:fill-box;transform-origin:center}
.heart.h2{animation-delay:.9s}.heart.h3{animation-delay:1.7s}
@keyframes floatUp{0%{transform:translateY(8px) scale(.5);opacity:0}25%{opacity:1}100%{transform:translateY(-34px) scale(1.1);opacity:0}}
.drop{animation:dropFall 1.8s ease-in infinite;transform-box:fill-box;transform-origin:center}
.drop.d2{animation-delay:.9s}
@keyframes dropFall{0%{transform:translateY(-4px);opacity:0}25%{opacity:1}100%{transform:translateY(20px);opacity:0}}
.twinkle{animation:twinkle 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.twinkle.t2{animation-delay:.6s}
@keyframes twinkle{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1.2);opacity:1}}
.cloud{animation:drift 26s linear infinite alternate}
.cloud.c2{animation-duration:34s}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(26px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.94);opacity:.85}50%{transform:scale(1.04);opacity:1}}
.skin{fill:var(--skin);stroke:var(--line);stroke-width:3;stroke-linejoin:round}
.snout{fill:var(--snout);stroke:var(--line);stroke-width:3}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar wood">
    <h1>🐷 豬豬夢工場<small>30 天豬生逆襲</small></h1>
    <div class="topbtns">
      <button class="tbtn" id="btnInstall" hidden>📲 安裝</button>
      <button class="tbtn" id="btnBook">📖 結局圖鑑</button>
      <button class="tbtn" id="btnSettings">⚙️ 設定</button>
      <button class="tbtn" id="btnRestart">🔄 重來</button>
    </div>
  </header>

  <main class="layout">
    <!-- 左：豬豬立繪與數值 -->
    <section class="stage wood">
      <div class="stage-view">
        <div class="badges">
          <div class="badge">📅 第 <span id="dayNum">1</span> / 30 天</div>
          <div class="badge">🪙 <span id="goldNum">100</span> G</div>
        </div>
        <div class="bubble" id="bubble">今天要做什麼呢？</div>

        <svg id="pigSvg" viewBox="-10 0 340 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="可愛的小粉豬">
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9bdcff"/><stop offset="1" stop-color="#fff2c9"/></linearGradient>
            <radialGradient id="auraGrad" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff2a8" stop-opacity=".95"/><stop offset="1" stop-color="#ffd24a" stop-opacity="0"/></radialGradient>
            <path id="heartPath" d="M0 5 C-8 -1 -8 -9 -3.6 -9 C-1.6 -9 0 -7.5 0 -6 C0 -7.5 1.6 -9 3.6 -9 C8 -9 8 -1 0 5 Z"/>
            <path id="starPath" d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2 Z"/>
          </defs>

          <!-- 牧場背景 -->
          <rect x="-10" width="340" height="340" fill="url(#sky)"/>
          <circle cx="268" cy="104" r="30" fill="#ffd95a" opacity=".28"/>
          <circle cx="268" cy="104" r="21" fill="#ffd95a"/>
          <g class="cloud c1"><ellipse cx="70" cy="86" rx="28" ry="11" fill="#fff"/><ellipse cx="92" cy="80" rx="19" ry="10" fill="#fff"/><ellipse cx="52" cy="82" rx="15" ry="8" fill="#fff"/></g>
          <g class="cloud c2"><ellipse cx="200" cy="64" rx="24" ry="9" fill="#fff" opacity=".9"/><ellipse cx="218" cy="59" rx="16" ry="8" fill="#fff" opacity=".9"/></g>
          <path d="M-10 244 Q80 200 170 236 T330 224 V340 H-10Z" fill="#b6e48a"/>
          <path d="M-10 274 Q120 248 330 270 V340 H-10Z" fill="#8ccf63"/>
          <!-- 小穀倉 -->
          <g transform="translate(14 196)">
            <rect width="54" height="46" fill="#d9534f" stroke="#8c2f2b" stroke-width="2.5"/>
            <path d="M-5 3 L27 -24 L59 3Z" fill="#b3413d" stroke="#8c2f2b" stroke-width="2.5" stroke-linejoin="round"/>
            <rect x="18" y="20" width="18" height="26" fill="#fff1d0" stroke="#8c2f2b" stroke-width="2.5"/>
            <path d="M18 20 L36 46 M36 20 L18 46" stroke="#8c2f2b" stroke-width="2"/>
          </g>
          <!-- 籬笆 -->
          <g fill="#cf9a62" stroke="#8a5a2e" stroke-width="2">
            <rect x="238" y="246" width="10" height="38" rx="2"/><rect x="262" y="246" width="10" height="38" rx="2"/>
            <rect x="286" y="246" width="10" height="38" rx="2"/><rect x="232" y="256" width="98" height="7" rx="2"/>
            <rect x="232" y="270" width="98" height="7" rx="2"/>
          </g>
          <ellipse cx="160" cy="300" rx="94" ry="13" fill="#7a5230" opacity=".35"/>

          <!-- 傳說光環 -->
          <g id="aura" style="display:none"><circle class="pulse" cx="160" cy="190" r="150" fill="url(#auraGrad)"/></g>

          <!-- 豬豬本體（依體重縮放） -->
          <g id="pigScale">
            <g class="breathe">
              <g id="pig">
                <!-- 披風（傳說等級才有） -->
                <path id="cape" style="display:none" d="M98 170 Q56 250 90 300 L230 300 Q264 250 222 170 Z" fill="#d9444f" stroke="#9a2a33" stroke-width="3" stroke-linejoin="round"/>
                <!-- 尾巴 -->
                <path d="M236 242 q24 -8 11 -26 q-11 -13 -22 3" fill="none" stroke="var(--line)" stroke-width="5" stroke-linecap="round"/>
                <!-- 腿 -->
                <rect class="skin" x="112" y="262" width="34" height="30" rx="13"/>
                <rect class="skin" x="174" y="262" width="34" height="30" rx="13"/>
                <rect x="112" y="282" width="34" height="10" rx="5" fill="var(--hoof)"/>
                <rect x="174" y="282" width="34" height="10" rx="5" fill="var(--hoof)"/>
                <!-- 身體 -->
                <ellipse class="skin" cx="160" cy="224" rx="80" ry="62"/>
                <ellipse cx="160" cy="238" rx="52" ry="36" fill="var(--belly)"/>
                <!-- 手臂 -->
                <ellipse class="skin" cx="86" cy="220" rx="14" ry="22" transform="rotate(18 86 220)"/>
                <ellipse class="skin" cx="234" cy="220" rx="14" ry="22" transform="rotate(-18 234 220)"/>
                <!-- 耳朵 -->
                <g id="earL">
                  <path class="skin" d="M100 96 Q68 54 116 70 Q131 85 124 106 Z"/>
                  <path d="M104 92 Q86 68 114 76 Q120 86 116 98 Z" fill="var(--inner)"/>
                </g>
                <g id="earR">
                  <path class="skin" d="M220 96 Q252 54 204 70 Q189 85 196 106 Z"/>
                  <path d="M216 92 Q234 68 206 76 Q200 86 204 98 Z" fill="var(--inner)"/>
                </g>
                <!-- 頭 -->
                <ellipse class="skin" cx="160" cy="135" rx="72" ry="64"/>
                <!-- 臉頰 -->
                <g id="cheeks" fill="var(--cheek)" opacity=".6"><circle cx="103" cy="152" r="11"/><circle cx="217" cy="152" r="11"/></g>
                <!-- 眼睛 -->
                <g class="eye"><ellipse cx="127" cy="128" rx="8" ry="10" fill="#2b1d1a"/><circle cx="124" cy="123" r="3.2" fill="#fff"/><circle cx="130" cy="132" r="1.5" fill="#fff"/></g>
                <g class="eye"><ellipse cx="193" cy="128" rx="8" ry="10" fill="#2b1d1a"/><circle cx="190" cy="123" r="3.2" fill="#fff"/><circle cx="196" cy="132" r="1.5" fill="#fff"/></g>
                <!-- 疲勞/生病的半闔眼 -->
                <g id="lids" style="display:none">
                  <rect x="116" y="116" width="22" height="11" fill="var(--skin)"/><line x1="115" y1="127" x2="139" y2="127" stroke="#7a3042" stroke-width="2.6" stroke-linecap="round"/>
                  <rect x="182" y="116" width="22" height="11" fill="var(--skin)"/><line x1="181" y1="127" x2="205" y2="127" stroke="#7a3042" stroke-width="2.6" stroke-linecap="round"/>
                </g>
                <!-- 豬鼻 -->
                <ellipse class="snout" cx="160" cy="152" rx="30" ry="21"/>
                <ellipse cx="150" cy="152" rx="4" ry="6.5" fill="var(--nostril)"/><ellipse cx="170" cy="152" rx="4" ry="6.5" fill="var(--nostril)"/>
                <!-- 嘴巴 -->

    real[k] = s[k] - before;
  }
  return real;
}

// 把外部（AI）資料整理成安全的事件物件；格式不對就回傳 null
const EFFECT_KEY_MAP = { stamina: 'stamina', intelligence: 'int', int: 'int', strength: 'str', str: 'str', charm: 'cha', cha: 'cha', weight: 'weight', gold: 'gold' };
const EFFECT_RANGE = { stamina: [-30, 30], int: [-5, 10], str: [-5, 10], cha: [-5, 10], weight: [-6, 8], gold: [-60, 90] };
function sanitizeEffects(raw) {
  const out = {};
  if (!raw || typeof raw !== 'object') return out;
  for (const [k, v] of Object.entries(raw)) {
    const key = EFFECT_KEY_MAP[k];
    const n = Math.round(Number(v));
    if (!key || !Number.isFinite(n)) continue;
    out[key] = clamp(n, EFFECT_RANGE[key][0], EFFECT_RANGE[key][1]);
  }
  return out;
}
function sanitizeEvent(obj) {
  if (!obj || typeof obj !== 'object') return null;
  const str = (v, max) => (typeof v === 'string' ? v.trim().slice(0, max) : '');
  const title = str(obj.title, 24), story = str(obj.story, 400);
  if (!title || !story || !Array.isArray(obj.choices) || obj.choices.length < 2) return null;
  const choices = [];
  for (const c of obj.choices.slice(0, 2)) {
    if (!c) return null;
    const text = str(c.text, 60), result = str(c.result, 300);
    if (!text || !result) return null;
    choices.push({ text, result, effects: sanitizeEffects(c.effects) });
  }
  return { title, emoji: str(obj.emoji, 4) || '📮', story, choices };
}

// 解析 AI 回傳（容忍 ```json 包裹或前後多餘文字）
function parseJsonLoose(text) {
  if (typeof text !== 'string') throw new Error('not text');
  let t = text.trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b <= a) throw new Error('no json');
  return JSON.parse(t.slice(a, b + 1));
}

// 在地備用事件：優先挑符合觸發原因標籤、且最近沒出現過的
function pickLocalEvent(s, tag) {
  const fresh = LOCAL_EVENTS.filter(e => !s.eventTitles.includes(e.title));
  const pool = fresh.length ? fresh : LOCAL_EVENTS;
  const tagged = tag ? pool.filter(e => e.tag === tag) : [];

}

async function onAction(id) {
  if (busyFlag || state.ended || state.pendingEvent) return;
  const a = ACTIONS.find(x => x.id === id);
  if (!canAfford(state, a)) { toast('豬豬幣不夠囉！先去打工吧'); return; }
  if (willCollapse(state, a)) {
    const ok = await confirmBox('⚠️ 體力快撐不住了', '做完這個行動，體力會歸零，豬豬會<b>昏倒住院 2 天</b>並扣醫藥費。<br>確定要硬撐嗎？', '硬撐！', '我再想想');
    if (!ok) return;
  }
  setBusy(true);
  const dayDone = state.day;
  const wasSick = state.sickDays > 0;
  const { real, weak } = runAction(state, a);
  if (wasSick) state.sickDays = Math.max(0, state.sickDays - 1);

  const flavor = pick(FLAVOR[a.id]);
  addLog(`${a.emoji} ${flavor}${weak ? '（身體虛弱，成效打七折）' : ''}`);
  flash(real);
  say(flavor.length > 16 ? flavor.slice(0, 16) + '…' : flavor);

  let nextDay = dayDone + 1;
  let hosp = null;
  if (state.stamina <= 0) {
    hosp = hospitalize(state);
    nextDay = dayDone + 3;     // 當天昏倒 + 住院 2 天
    addLog(`🏥 體力歸零昏倒！住院休息 2 天，醫藥費 ${hosp.fee}G。`, 'bad');
  }
  state.day = nextDay;
  save();
  renderAll();

  if (hosp) {
    await new Promise(res => showModal({
      title: '🏥 昏倒住院！',
      html: `<div class="big">🤒</div><p>豬豬體力歸零，被緊急送進牧場醫院。<br>強制休息 <b>2 天</b>，支付醫藥費 <b>${hosp.fee}G</b>。</p><p class="small">出院後體力恢復到 60，但身體還很虛弱，下次行動成效打七折。</p>`,
      buttons: [{ text: '好吧…乖乖休息', cls: 'center primary', onClick: () => { closeModal(); res(); } }],
    }));
  }

  if (state.day > TOTAL_DAYS) { setBusy(false); await finishGame(); return; }

  const trig = checkEventTrigger(state);
  if (trig) {
    state.nextEventDay = state.day + rand(3, 4);
    save();
    await runEvent(trig);
  }
  setBusy(false);
  save();
  renderAll();
  say(pick({ happy: ['今天心情超好！', '哼哼～再來一份松露！', '我感覺自己無所不能！'], normal: ['今天要做什麼呢？', '準備好了，老闆！', '努力成為傳奇豬！'], tired: ['好累喔…想睡覺…', '腳軟軟的…', '讓我休息一下嘛…'], sick: ['頭暈暈的…', '我覺得…不太舒服…', '需要補充體力…'] }[getMood(state)]));
}

// ---------- Gemini ----------
async function callGemini(prompt) {
  const key = getKey();
  if (!key) throw new Error('NO_KEY');
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;
  const contents = [{ role: 'user', parts: [{ text: prompt }] }];
  // 第一組設定關閉思考以加快速度；若被拒絕（400）就退回最簡設定
  const bodies = [
    { contents, generationConfig: { responseMimeType: 'application/json', temperature: 1, maxOutputTokens: 1200, thinkingConfig: { thinkingBudget: 0 } } },
    { contents, generationConfig: { responseMimeType: 'application/json', temperature: 1 } },
  ];
  let lastErr = new Error('unknown');
  for (let i = 0; i < bodies.length; i++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 25000);
    try {
      const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key }, body: JSON.stringify(bodies[i]), signal: ctrl.signal });
      if (!r.ok) {
        lastErr = new Error('HTTP ' + r.status);
        if (r.status === 400 && i < bodies.length - 1) continue;
        throw lastErr;
      }
      const data = await r.json();
      const text = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts || []).map(p => p.text || '').join('');
      if (!text) throw new Error('EMPTY');
      return text;
    } finally { clearTimeout(timer); }
  }
  throw lastErr;
}

}
function aiFail(e) {
  if (!aiWarned && e && e.message !== 'NO_KEY') { aiWarned = true; toast('AI 連線失敗，改用內建內容（請檢查 API Key 與網路）', 3600); }
}

async function getNews(ending) {
  const s = state;
  const fallback = () => ({
    headline: ending.headline, subhead: `豬豬日報特別報導：${ending.title}`,
    article: `${ending.story}\n據悉，這位豬豬主角在 30 天內累積了智慧 ${s.int}、力量 ${s.str}、魅力 ${s.cha}，體重 ${s.weight} 公斤，口袋裡還剩 ${s.gold} 枚豬豬幣。\n${pick(['鄰居們紛紛表示：「我們一直都知道他很特別。」', '牧場長老說：「這孩子的未來，不可限量。」', '本報記者實地採訪，豬豬仍然邊吃點心邊微笑，不願多透露細節。'])}`,
    quote: ending.quote, source: 'local',
  });
  if (!getKey()) return fallback();
  try {
    const prompt = `你是《豬豬日報》的資深記者。一隻小豬經過 30 天的養成，達成了結局「${ending.title}」。
最終數值：智慧${s.int}、力量${s.str}、魅力${s.cha}、體重${s.weight}kg、豬豬幣${s.gold}G。
這 30 天裡發生過的事件：${s.eventTitles.join('、') || '平靜的日常'}。
請寫一則搞笑又溫馨的報紙頭條報導（繁體中文，台灣用語），內容要呼應結局與最終數值，並可以巧妙帶到上述經歷。
只回傳純 JSON，不要 markdown 與任何說明，格式：
{"headline":"頭條大標(24字內)","subhead":"副標(32字內)","article":"內文，120~200字，分2~3段，段落用\\n分隔","quote":"小豬受訪的一句話(28字內)"}`;
    const o = parseJsonLoose(await callGemini(prompt));
    const t = (v, n) => (typeof v === 'string' ? v.trim().slice(0, n) : '');
    const news = { headline: t(o.headline, 60), subhead: t(o.subhead, 80), article: t(o.article, 700), quote: t(o.quote, 80), source: 'ai' };
    if (!news.headline || !news.article) throw new Error('BAD_NEWS');
    return news;
  } catch (e) { aiFail(e); return fallback(); }
}

    });
  });
}

  if (busyFlag) return;
  if (!state.ended) {
    const ok = await confirmBox('🔄 重新開始？', '目前的養成進度會消失，但<b>結局圖鑑</b>會保留。', '重新開始', '取消');
    if (!ok) return;
  }
  state = newState();
  save(); setBusy(false); closeModal(); renderAll(); say('新的豬生，開始囉！'); showIntro();
}

// ---------- 啟動 ----------
async function init() {
  state = loadState() || newState();
  buildStats(); renderAll();
  $('btnBook').addEventListener('click', () => showBook(false));
  $('btnSettings').addEventListener('click', showSettings);
  $('btnRestart').addEventListener('click', restart);
  $('btnInstall').addEventListener('click', async () => {
    if (!deferredInstall) return;
    deferredInstall.prompt();
    try { await deferredInstall.userChoice; } catch (e) { /* 忽略 */ }
    deferredInstall = null; $('btnInstall').hidden = true;
  });
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; $('btnInstall').hidden = false; });
  window.addEventListener('appinstalled', () => { $('btnInstall').hidden = true; toast('已加到主畫面 🎉'); });

  if (state.ended) { setBusy(true); await showEnding(); setBusy(false); return; }
  if (state.pendingEvent) {          // 事件進行到一半就關掉頁面時，接續顯示
    setBusy(true);
    await presentEvent(state.pendingEvent);
    state.pendingEvent = null; save(); setBusy(false); renderAll();
    return;
  }
  if (state.day === 1 && state.log.length === 0) showIntro();
}

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* 離線功能失敗不影響遊玩 */ }));
}
init();
</script>
