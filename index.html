<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>豬豬夢工場：30天豬生逆襲</title>
<meta name="description" content="30 天把一隻普通小粉豬養成傳奇豬豬！繁體中文養成模擬網頁遊戲，支援加到主畫面（PWA），串接 Gemini 產生突發事件與結局報導。">
<meta name="theme-color" content="#8b5a2b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="豬豬夢工場">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* ===== 基本設定 ===== */
:root{
  --paper:#fff3c4; --ink:#4a3320;
  --wood1:#9a6a3a; --wood2:#7f5329; --wood-dark:#4b2f14;
  --green:#6cc04a; --yellow:#f5c542; --red:#e8584f; --blue:#4c9be8; --pink:#f06fa0; --orange:#f08a3c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  color:var(--ink);
  background-color:#8fd16b;
  background-image:radial-gradient(#7cc15a 2px,transparent 2.5px);
  background-size:24px 24px;
  line-height:1.5;
}
button{font-family:inherit}
#app{max-width:1100px;margin:0 auto;padding:10px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}

/* ===== 木頭質感邊框 ===== */
.wood{
  background:repeating-linear-gradient(92deg,#9a6a3a 0 7px,#8a5c2f 7px 9px,#a3733f 9px 17px,#7f5329 17px 18px);
  border-radius:14px;padding:10px;
  box-shadow:inset 0 0 0 2px #5e3b1b,inset 0 0 0 4px rgba(255,220,160,.25),0 5px 0 var(--wood-dark),0 8px 14px rgba(0,0,0,.25);
}

/* ===== 頂部列 ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;padding:8px 12px}
.topbar h1{margin:0;font-size:1.25rem;color:#fff3c4;text-shadow:2px 2px 0 #4b2f14;letter-spacing:1px;line-height:1.2}
.topbar h1 small{display:block;font-size:.72rem;color:#ffe29a;letter-spacing:0;font-weight:600}
.topbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tbtn{border:2px solid var(--wood-dark);background:#fff3c4;color:var(--ink);border-radius:8px;padding:5px 9px;font-size:.85rem;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--wood-dark)}
.tbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood-dark)}

/* ===== 版面：左邊豬豬、右邊筆記本 ===== */
.layout{display:grid;grid-template-columns:minmax(300px,430px) 1fr;gap:16px;align-items:start}
.stage{position:sticky;top:10px}
@media (max-width:620px){
  .tbtn .lbl{display:none}
  .tbtn{padding:5px 9px;font-size:1.05rem}
  .topbar h1{white-space:nowrap}
}
@media (max-width:780px){
  .layout{grid-template-columns:1fr}
  .stage{position:static}
  .topbar h1{font-size:1.05rem}
}

/* ===== 豬豬舞台 ===== */
.stage-view{position:relative}
#pigSvg{width:100%;height:auto;display:block;border:3px solid var(--wood-dark);border-radius:10px;background:#bfe9ff}
.badges{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:5px;align-items:flex-end;z-index:2}
.badge{background:#fff8dc;border:3px solid var(--wood-dark);border-radius:8px;padding:1px 9px;font-weight:800;font-size:.95rem;box-shadow:0 3px 0 var(--wood-dark)}
.bubble{
  position:absolute;left:10px;top:10px;max-width:56%;z-index:2;
  background:#fff;border:3px solid var(--wood-dark);border-radius:12px;padding:5px 10px;font-size:.85rem;font-weight:700;
  box-shadow:0 3px 0 rgba(75,47,20,.6);
}
.bubble::after{content:"";position:absolute;left:26px;bottom:-12px;border:6px solid transparent;border-top:9px solid var(--wood-dark)}
.pigtag{
  display:inline-block;margin:10px 0 8px;padding:3px 12px;border:3px solid var(--wood-dark);border-radius:6px;
  background:#ffe29a;font-weight:900;box-shadow:0 3px 0 var(--wood-dark)
}
.stats{background:#fff3c4;border:3px solid #5e3b1b;border-radius:10px;padding:8px 10px}
.stat{display:grid;grid-template-columns:76px 1fr 74px;align-items:center;gap:8px;padding:3px 0}
.stat .lbl{font-weight:800;font-size:.9rem;white-space:nowrap}
.bar{position:relative;height:16px;background:#d9c79a;border:2px solid #5e3b1b;border-radius:5px;overflow:hidden}
.fill{position:relative;height:100%;width:0;transition:width .5s ease,background .3s}
.fill::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(255,255,255,.28) 6px 8px)}
.val{position:relative;font-weight:800;font-size:.9rem;text-align:right;white-space:nowrap}
.delta{position:absolute;right:0;top:-14px;font-size:.85rem;font-weight:900;opacity:0;pointer-events:none}
.delta.show{animation:deltaPop 1.3s ease-out}
.delta.up{color:#2f8a1a}.delta.down{color:#c23a30}
@keyframes deltaPop{0%{opacity:0;transform:translateY(8px)}15%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}

/* ===== 筆記本 ===== */
.paper{
  position:relative;padding:14px 14px 16px 50px;border:3px solid #d9bd6a;border-radius:8px;background-color:var(--paper);
  background-image:
    repeating-linear-gradient(to bottom,transparent 0,transparent 27px,rgba(110,150,200,.33) 27px,rgba(110,150,200,.33) 28px),
    linear-gradient(90deg,transparent 36px,rgba(220,90,90,.45) 36px,rgba(220,90,90,.45) 38px,transparent 38px);
}
.paper::before{
  content:"";position:absolute;left:9px;top:12px;bottom:12px;width:16px;
  background:radial-gradient(circle at 8px 8px,#6b4a2b 0 5px,transparent 5.5px) 0 0/16px 30px repeat-y;
}
.paper h2{margin:0 0 10px;font-size:1.15rem}
.paper h3{margin:16px 0 6px;font-size:1rem}
.hint{font-size:.8rem;color:#7a6040;margin:2px 0 10px}

.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.act{
  text-align:left;padding:9px 10px;border:3px solid var(--wood-dark);border-radius:8px;background:#fffaf0;color:var(--ink);
  box-shadow:0 4px 0 var(--wood-dark);cursor:pointer;display:flex;flex-direction:column;gap:5px;font-size:1rem;
  transition:transform .06s,box-shadow .06s,background .15s;
}
.act:hover{background:#fff}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood-dark)}
.act:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.45)}
.act .name{font-weight:900}
.act.danger{border-color:#b3302a;box-shadow:0 4px 0 #b3302a}
.act .warn{font-size:.74rem;color:#b3302a;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:.72rem;padding:0 6px;border-radius:10px;border:1px solid;font-weight:800;white-space:nowrap}
.chip.up{background:#e3f7d8;border-color:#7cbf5a;color:#2f7a1a}
.chip.down{background:#fde4e1;border-color:#e58a82;color:#a3322a}
body.busy .act{pointer-events:none;opacity:.6}

.log{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto}
.log li{padding:3px 0;font-size:.88rem;border-bottom:1px dashed rgba(120,90,50,.3)}
.log .d{display:inline-block;min-width:3.4em;font-weight:900;color:#a06a2a}
.log li.ev{color:#7a2f8a}
.log li.bad{color:#b3302a}

/* ===== 彈窗 ===== */
.overlay{position:fixed;inset:0;background:rgba(40,25,10,.62);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:14px;padding:10px;
  background:repeating-linear-gradient(92deg,#9a6a3a 0 7px,#8a5c2f 7px 9px,#a3733f 9px 17px,#7f5329 17px 18px);
  box-shadow:inset 0 0 0 2px #5e3b1b,0 8px 0 var(--wood-dark),0 14px 30px rgba(0,0,0,.4);animation:pop .22s ease-out;
}
.modal.wide{width:min(760px,100%)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal-inner{background:var(--paper);border:3px solid #d9bd6a;border-radius:8px;padding:14px 16px}
.modal h2{margin:0 0 8px;font-size:1.25rem;text-align:center}
.modal .big{font-size:2.6rem;text-align:center;line-height:1.1}
.modal p{margin:6px 0}
.modal-btns{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.modal-btns.row{flex-direction:row;flex-wrap:wrap;justify-content:center}
.mbtn{
  border:3px solid var(--wood-dark);border-radius:8px;background:#fffaf0;color:var(--ink);padding:9px 12px;font-size:1rem;font-weight:800;
  cursor:pointer;box-shadow:0 4px 0 var(--wood-dark);text-align:left
}
.mbtn.center{text-align:center}
.mbtn.primary{background:#ffd95a}
.mbtn:hover{filter:brightness(1.05)}
.mbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood-dark)}
.spinner{width:38px;height:38px;border:5px solid #e0c080;border-top-color:#8b5a2e;border-radius:50%;animation:spin 1s linear infinite;margin:12px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.small{font-size:.8rem;color:#7a6040}
.tag-ai{display:inline-block;font-size:.7rem;padding:0 7px;border-radius:9px;background:#e7d7ff;color:#5a2d91;font-weight:800;margin-left:6px;vertical-align:middle}
.tag-local{background:#e0e0e0;color:#555}
.field{width:100%;padding:8px;border:2px solid #5e3b1b;border-radius:6px;font-size:1rem;background:#fff;margin:6px 0}

/* ===== 報紙 ===== */
.news{
  background:#f3e8c9;border:2px solid #3b3025;padding:10px 14px 14px;margin:8px 0;
  font-family:"Noto Serif TC","Songti TC","PMingLiU","Source Han Serif TC",serif;color:#2b2218;
  box-shadow:3px 3px 0 rgba(0,0,0,.2);transform:rotate(-.6deg)
}
.news .mast{text-align:center;font-size:1.7rem;font-weight:900;letter-spacing:.35em;border-bottom:4px double #3b3025;padding-bottom:4px}
.news .meta{display:flex;justify-content:space-between;font-size:.72rem;border-bottom:1px solid #3b3025;padding:3px 0;margin-bottom:8px}
.news .head{font-size:1.55rem;font-weight:900;line-height:1.25;margin:6px 0 2px}
.news .sub{font-size:.95rem;font-weight:700;margin-bottom:8px;color:#5a4630}
.news .body{font-size:.92rem;line-height:1.75;text-align:justify}
.news .body p{margin:0 0 6px;text-indent:2em}
.news .quote{margin-top:8px;padding:6px 10px;border-left:4px solid #3b3025;font-style:italic;background:rgba(0,0,0,.05)}

/* ===== 圖鑑 ===== */
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:8px}
.bcard{border:3px solid #5e3b1b;border-radius:8px;background:#fffaf0;padding:8px;text-align:center;font-size:.82rem}
.bcard .e{font-size:2rem}
.bcard .t{font-weight:900;font-size:.95rem}
.bcard.locked{background:#d8cdb0;color:#7a6a4a}
.bcard.locked .e{filter:grayscale(1) brightness(.5)}
/* 天氣 */
.wxline{margin:0 0 10px;padding:5px 10px;border:2px dashed #b99a5a;border-radius:8px;background:rgba(255,255,255,.55);font-size:.85rem;font-weight:700}
.act .wx{font-size:.74rem;font-weight:800;color:#2a6f9e}
.act .wx:empty{display:none}
.act.blocked{opacity:.45;filter:grayscale(.6)}
.pigsvg .sky0{stop-color:#9bdcff;transition:stop-color 1s}
.pigsvg .sky1{stop-color:#fff2c9;transition:stop-color 1s}
.pigsvg[data-wx=cloudy] .sky0{stop-color:#b9c9d6}
.pigsvg[data-wx=cloudy] .sky1{stop-color:#eef0ea}
.pigsvg[data-wx=rainy] .sky0{stop-color:#7f93a8}
.pigsvg[data-wx=rainy] .sky1{stop-color:#c9d3d8}
.pigsvg[data-wx=stormy] .sky0{stop-color:#4c5870}
.pigsvg[data-wx=stormy] .sky1{stop-color:#8b95a3}
.pigsvg[data-wx=hot] .sky0{stop-color:#ffc27a}
.pigsvg[data-wx=hot] .sky1{stop-color:#fff0b8}
.pigsvg[data-wx=cold] .sky0{stop-color:#a9cdea}
.pigsvg[data-wx=cold] .sky1{stop-color:#eef6fb}
.pigsvg[data-wx=cloudy] .sunG,.pigsvg[data-wx=rainy] .sunG,.pigsvg[data-wx=stormy] .sunG{opacity:0}
.pigsvg[data-wx=cold] .sunG{opacity:.55}
.pigsvg[data-wx=hot] .sunG{transform:scale(1.35);transform-box:fill-box;transform-origin:center}
.pigsvg[data-wx=hot] .sunG circle{fill:#ff9d2e}
.sunG{transition:opacity 1s}
.pigsvg[data-wx=rainy] .cloud ellipse,.pigsvg[data-wx=stormy] .cloud ellipse{fill:#8e9aa8}
.pigsvg[data-wx=stormy] .cloud ellipse{fill:#5d6674}
.pigsvg[data-wx=cloudy] .cloud ellipse{fill:#dfe5ea}
.wx-drop{animation:wxFall linear infinite}
@keyframes wxFall{from{transform:translateY(-30px)}to{transform:translateY(360px)}}
.wx-flake{animation:wxSnow linear infinite}
@keyframes wxSnow{0%{transform:translate(0,-10px)}50%{transform:translate(10px,170px)}100%{transform:translate(-4px,350px)}}
.lightning{opacity:0;fill:#fff}
.pigsvg[data-wx=stormy] .lightning{animation:flash 5s infinite}
@keyframes flash{0%,88%,92%,96%,100%{opacity:0}89%{opacity:.75}93%{opacity:.5}}
/* 排行榜 */
.scorebox{margin:8px 0;padding:6px 10px;border:3px solid #5e3b1b;border-radius:8px;background:#fff7d6;text-align:center;font-weight:800}
.scorebox b{font-size:1.5rem;color:#c25a00}
.scorebox small{display:block;font-weight:600;color:#7a6040;font-size:.75rem}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.tab{border:3px solid var(--wood-dark);border-radius:8px;background:#fffaf0;padding:3px 14px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--wood-dark)}
.tab.on{background:#ffd95a}
.lb{width:100%;border-collapse:collapse;font-size:.88rem}
.lb th,.lb td{padding:5px 6px;border-bottom:1px dashed rgba(120,90,50,.4);text-align:left}
.lb th{font-size:.78rem;color:#7a6040}
.lb td.r{text-align:right;white-space:nowrap}
.lb tr.me{background:#fff0a8}
.lb .rk{font-weight:900;white-space:nowrap;width:2.6em}
.lb .nm{font-weight:800;word-break:break-all}
.lb .sub{display:block;font-size:.72rem;color:#7a6040;font-weight:600}
.lb-empty{text-align:center;padding:16px 4px}
.stars{color:#e0a000;letter-spacing:1px}

.endpig{width:min(220px,60%);margin:0 auto;display:block}
.endpig svg{width:100%;height:auto;border:3px solid var(--wood-dark);border-radius:10px;display:block}
.sumrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.sumrow span{background:#fff;border:2px solid #5e3b1b;border-radius:8px;padding:1px 8px;font-weight:800;font-size:.85rem}

.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#4b2f14;color:#fff3c4;padding:8px 16px;border-radius:20px;font-weight:700;z-index:80;box-shadow:0 4px 12px rgba(0,0,0,.35);max-width:90vw;text-align:center}

/* ===== 豬豬動畫 ===== */
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.03)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.4s infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.heart{animation:floatUp 2.6s ease-in infinite;transform-box:fill-box;transform-origin:center}
.heart.h2{animation-delay:.9s}.heart.h3{animation-delay:1.7s}
@keyframes floatUp{0%{transform:translateY(8px) scale(.5);opacity:0}25%{opacity:1}100%{transform:translateY(-34px) scale(1.1);opacity:0}}
.drop{animation:dropFall 1.8s ease-in infinite;transform-box:fill-box;transform-origin:center}
.drop.d2{animation-delay:.9s}
@keyframes dropFall{0%{transform:translateY(-4px);opacity:0}25%{opacity:1}100%{transform:translateY(20px);opacity:0}}
.twinkle{animation:twinkle 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.twinkle.t2{animation-delay:.6s}
@keyframes twinkle{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1.2);opacity:1}}
.cloud{animation:drift 26s linear infinite alternate}
.cloud.c2{animation-duration:34s}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(26px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.94);opacity:.85}50%{transform:scale(1.04);opacity:1}}
.skin{fill:var(--skin);stroke:var(--line);stroke-width:3;stroke-linejoin:round}
.snout{fill:var(--snout);stroke:var(--line);stroke-width:3}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar wood">
    <h1>🐷 豬豬夢工場<small>30 天豬生逆襲</small></h1>
    <div class="topbtns">
      <button class="tbtn" id="btnInstall" title="安裝到主畫面" aria-label="安裝到主畫面" hidden>📲<span class="lbl"> 安裝</span></button>
      <button class="tbtn" id="btnSound" title="音效開關" aria-label="音效開關">🔊</button>
      <button class="tbtn" id="btnRank" title="排行榜" aria-label="排行榜">🏆<span class="lbl"> 排行榜</span></button>
      <button class="tbtn" id="btnBook" title="結局圖鑑" aria-label="結局圖鑑">📖<span class="lbl"> 結局圖鑑</span></button>
      <button class="tbtn" id="btnSettings" title="設定" aria-label="設定">⚙️<span class="lbl"> 設定</span></button>
      <button class="tbtn" id="btnRestart" title="重新開始" aria-label="重新開始">🔄<span class="lbl"> 重來</span></button>
    </div>
  </header>

  <main class="layout">
    <!-- 左：豬豬立繪與數值 -->
    <section class="stage wood">
      <div class="stage-view">
        <div class="badges">
          <div class="badge">📅 第 <span id="dayNum">1</span> / 30 天</div>
          <div class="badge" id="wxBadge">☀️ 晴天</div>
          <div class="badge">🪙 <span id="goldNum">100</span> G</div>
        </div>
        <div class="bubble" id="bubble">今天要做什麼呢？</div>

        <svg id="pigSvg" class="pigsvg" viewBox="-10 0 340 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="可愛的小粉豬">
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop class="sky0" offset="0" stop-color="#9bdcff"/><stop class="sky1" offset="1" stop-color="#fff2c9"/></linearGradient>
            <radialGradient id="auraGrad" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#fff2a8" stop-opacity=".95"/><stop offset="1" stop-color="#ffd24a" stop-opacity="0"/></radialGradient>
            <path id="heartPath" d="M0 5 C-8 -1 -8 -9 -3.6 -9 C-1.6 -9 0 -7.5 0 -6 C0 -7.5 1.6 -9 3.6 -9 C8 -9 8 -1 0 5 Z"/>
            <path id="starPath" d="M0 -9 L2.2 -2.2 L9 0 L2.2 2.2 L0 9 L-2.2 2.2 L-9 0 L-2.2 -2.2 Z"/>
          </defs>

          <!-- 牧場背景 -->
          <rect x="-10" width="340" height="340" fill="url(#sky)"/>
          <g class="sunG"><circle cx="268" cy="104" r="30" fill="#ffd95a" opacity=".28"/><circle cx="268" cy="104" r="21" fill="#ffd95a"/></g>
          <g class="cloud c1"><ellipse cx="70" cy="86" rx="28" ry="11" fill="#fff"/><ellipse cx="92" cy="80" rx="19" ry="10" fill="#fff"/><ellipse cx="52" cy="82" rx="15" ry="8" fill="#fff"/></g>
          <g class="cloud c2"><ellipse cx="200" cy="64" rx="24" ry="9" fill="#fff" opacity=".9"/><ellipse cx="218" cy="59" rx="16" ry="8" fill="#fff" opacity=".9"/></g>
          <path d="M-10 244 Q80 200 170 236 T330 224 V340 H-10Z" fill="#b6e48a"/>
          <path d="M-10 274 Q120 248 330 270 V340 H-10Z" fill="#8ccf63"/>
          <!-- 小穀倉 -->
          <g transform="translate(14 196)">
            <rect width="54" height="46" fill="#d9534f" stroke="#8c2f2b" stroke-width="2.5"/>

<script>
'use strict';
/* =====================================================================
 *  豬豬夢工場：30天豬生逆襲
 *  - 純前端單檔遊戲（HTML / CSS / SVG / JS），可安裝為 PWA
 *  - 突發事件與結局報導：呼叫 Gemini（gemini-2.5-flash），失敗時自動改用內建內容
 * ===================================================================== */

// ===== LOGIC START =====（下面是不碰 DOM 的純邏輯，方便測試）
const TOTAL_DAYS = 30;
const MODEL = 'gemini-2.5-flash';
const SAVE_KEY = 'pdf_save_v1';
const BOOK_KEY = 'pdf_endings_v1';
const API_KEY_STORE = 'pdf_gemini_key';
const LB_KEY = 'pdf_leaderboard_v1';     // 本機排行榜
const SND_KEY = 'pdf_sound';             // 音效開關
const VIB_KEY = 'pdf_vibrate';           // 震動開關
const NAME_KEY = 'pdf_player_name';      // 玩家暱稱
const DEVICE_KEY = 'pdf_device_id';      // 匿名裝置代碼（線上排行榜用來辨識同一位玩家）
const LB_URL = ((window.PIG_CONFIG && window.PIG_CONFIG.leaderboardUrl) || '').replace(/\/+$/, '');

// 各數值的上下限
const { OMNI_MIN, ENDINGS, pickEnding, calcScore, cleanName, NAME_MAX } = PigCore;
const KEYS = ['stamina', 'int', 'str', 'cha', 'weight', 'gold'];
const LIMITS = { stamina: [0, 100], int: [0, 100], str: [0, 100], cha: [0, 100], weight: [10, 200], gold: [0, 99999] };
const LABEL = { stamina: '體力', int: '智慧', str: '力量', cha: '魅力', weight: '體重', gold: '豬豬幣' };
const UNIT = { stamina: '', int: '', str: '', cha: '', weight: 'kg', gold: 'G' };

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = arr => arr[Math.floor(Math.random() * arr.length)];

// 六個每日行程（main = 主要成長的數值，range = 成長範圍）
const ACTIONS = [
  { id: 'library', emoji: '📚', name: '豬豬圖書館', main: 'int', range: [6, 10], delta: { stamina: -15, gold: -10 } },
  { id: 'gym',     emoji: '🏋️', name: '泥巴健身房', main: 'str', range: [6, 10], delta: { stamina: -20, weight: -2 } },
  { id: 'charm',   emoji: '💃', name: '儀態訓練課', main: 'cha', range: [6, 10], delta: { stamina: -15, gold: -15 } },
  { id: 'feast',   emoji: '🍔', name: '豪華松露大餐', delta: { stamina: 40, weight: 5, gold: -25 } },
  { id: 'work',    emoji: '🧹', name: '牧場打工', delta: { gold: 40, stamina: -20, cha: -2 } },
  { id: 'sleep',   emoji: '💤', name: '睡大覺休息', delta: { stamina: 50, weight: 1 } },
];

const FLAVOR = {
  library: ['豬豬抱著厚厚的書啃了一整天，腦袋鼓鼓的。', '在圖書館發現一本《泥巴與數學》，看得入迷。', '一邊翻書一邊流口水，居然還記住了！'],
  gym: ['泥巴槓鈴舉起來！肌肉在哭也在笑。', '在泥巴裡推了一百下，渾身都是勁。', '教練喊「再一下！」然後自己先喘了。'],
  charm: ['頭頂書本走直線，優雅度提升中～', '學會了完美的轉圈圈與眨眼。', '對著鏡子練習微笑，連自己都被迷倒。'],
  feast: ['松露大餐太香了，吃到肚子圓滾滾！', '一口松露一口幸福，罪惡感先放一邊。', '盤子舔得比洗過還乾淨。'],
  work: ['在牧場搬了一整天乾草，累但荷包鼓了。', '幫母牛遞了一整天水桶，賺到工錢。', '滿身乾草，魅力掉了點，但錢是真的。'],
  sleep: ['呼嚕嚕～睡得像一顆球。', '夢到自己變成傳奇豬，嘴角還在笑。', '睡飽飽，精神全回來了。'],
};

// 結局資料、判定與計分都在 game-core.js（與排行榜伺服器共用）

// 把數值變化套進狀態並做上下限控制，回傳「實際」變動量
function applyDelta(s, d) {
  const real = {};
  for (const k of KEYS) {
    if (!d[k]) continue;
    const before = s[k];
    s[k] = clamp(before + d[k], LIMITS[k][0], LIMITS[k][1]);
    real[k] = s[k] - before;
  }
  return real;
}

function newState() {
  return {
    v: 1, day: 1, stamina: 100, int: 10, str: 10, cha: 10, weight: 30, gold: 100,
    sickDays: 0, nextEventDay: rand(3, 4), hit: {}, eventTitles: [], log: [],
    pendingEvent: null, ended: false, endingId: null, news: null, hospitalCount: 0, aiEvents: 0,
    weather: 'sunny',
  };
}

// ---------- 天氣系統 ----------
// 每天隨機一種天氣，會影響行程的效果，也會影響突發事件的內容
const WEATHER = {
  sunny:  { emoji: '☀️', name: '晴天',   tip: '陽光普照，牧場打工多賺 10G。' },
  cloudy: { emoji: '☁️', name: '陰天',   tip: '天氣涼爽，圖書館、健身房、儀態課少耗 3 點體力。' },
  rainy:  { emoji: '🌧️', name: '雨天',   tip: '適合窩在圖書館：智慧額外 +2；但打工客人少，少賺 10G。' },
  hot:    { emoji: '🥵', name: '酷暑',   tip: '太熱了！訓練與打工多耗 5 體力，睡覺只回 40 體力。' },
  cold:   { emoji: '🥶', name: '寒流',   tip: '泥巴健身房暖身效果好：力量額外 +2；松露大餐多回 10 體力。' },
  stormy: { emoji: '⛈️', name: '暴風雨', tip: '牧場停工，今天不能打工；睡覺特別安穩，多回 10 體力。' },
};
const WEATHER_ODDS = [['sunny', 35], ['cloudy', 25], ['rainy', 20], ['hot', 8], ['cold', 8], ['stormy', 4]];
function rollWeather() {
  let r = Math.random() * WEATHER_ODDS.reduce((n, x) => n + x[1], 0);
  for (const [k, w] of WEATHER_ODDS) { if ((r -= w) < 0) return k; }
  return 'sunny';
}
// 某天氣對某行程的修正：delta＝額外的數值變化、bonus＝主要成長額外加成、blocked＝今天不能做、note＝按鈕上的提示
function weatherMod(w, id) {
  const m = { delta: {}, bonus: 0, blocked: null, note: '' };
  const train = id === 'library' || id === 'gym' || id === 'charm';
  if (w === 'sunny' && id === 'work') { m.delta.gold = 10; m.note = '☀️ 晴天 金幣 +10'; }
  else if (w === 'cloudy' && train) { m.delta.stamina = 3; m.note = '☁️ 陰天 體力少耗 3'; }
  else if (w === 'rainy' && id === 'library') { m.bonus = 2; m.note = '🌧️ 雨天 智慧 +2'; }
  else if (w === 'rainy' && id === 'work') { m.delta.gold = -10; m.note = '🌧️ 雨天 金幣 −10'; }
  else if (w === 'hot' && (train || id === 'work')) { m.delta.stamina = -5; m.note = '🥵 酷暑 體力多耗 5'; }
  else if (w === 'hot' && id === 'sleep') { m.delta.stamina = -10; m.note = '🥵 酷暑 回復減少'; }
  else if (w === 'cold' && id === 'gym') { m.bonus = 2; m.note = '🥶 寒流 力量 +2'; }
  else if (w === 'cold' && id === 'feast') { m.delta.stamina = 10; m.note = '🥶 寒流 體力 +10'; }
  else if (w === 'stormy' && id === 'work') { m.blocked = '暴風雨，牧場今天停工'; m.note = '⛈️ 暴風雨 停工'; }
  else if (w === 'stormy' && id === 'sleep') { m.delta.stamina = 10; m.note = '⛈️ 暴風雨 體力 +10'; }
  return m;
}
// 套用天氣後，這個行程「實際」的數值變化
function effDelta(s, a) {
  const d = Object.assign({}, a.delta), m = weatherMod(s.weather, a.id).delta;
  for (const k of Object.keys(m)) d[k] = (d[k] || 0) + m[k];
  return d;
}
// 換日：進入新的一天並重新抽天氣
function advanceDay(s, nextDay) { s.day = nextDay; s.weather = rollWeather(); }

// 檢查這一步能不能做：金幣是否足夠
function canAfford(s, a) { return s.gold + (effDelta(s, a).gold || 0) >= 0; }
// 今天因天氣不能做的原因（沒有則為空字串）
function blockedReason(s, a) { return weatherMod(s.weather, a.id).blocked || ''; }
// 今天能不能做：付得起、且沒被天氣擋住
function canDo(s, a) { return canAfford(s, a) && !blockedReason(s, a); }
// 做了之後體力會不會歸零（歸零會昏倒）
function willCollapse(s, a) { return s.stamina + (effDelta(s, a).stamina || 0) <= 0; }

// 執行行動（純邏輯）：體力偏低或病後虛弱時，成長打七折
function runAction(s, a) {
  const d = effDelta(s, a);
  let weak = false;
  if (a.main) {
    let g = rand(a.range[0], a.range[1]) + weatherMod(s.weather, a.id).bonus;
    if (s.stamina < 25 || s.sickDays > 0) { g = Math.max(1, Math.round(g * 0.7)); weak = true; }
    d[a.main] = (d[a.main] || 0) + g;
  }
  return { real: applyDelta(s, d), weak };
}

// 昏倒住院：扣醫藥費、恢復體力、病後虛弱
function hospitalize(s) {
  const fee = Math.min(s.gold, 40);

// 事件觸發判定：門檻事件（每個只觸發一次）或定期事件
const THRESHOLDS = [
  ['int40', s => s.int >= 40, 'int', '智慧突破 40，成了牧場的小天才'],
  ['int70', s => s.int >= 70, 'int', '智慧突破 70，名聲傳遍各個牧場'],
  ['str40', s => s.str >= 40, 'str', '力量突破 40，肌肉開始有存在感'],
  ['str70', s => s.str >= 70, 'str', '力量突破 70，已是牧場最強壯的豬'],
  ['cha40', s => s.cha >= 40, 'cha', '魅力突破 40，走到哪都有人回頭'],
  ['cha70', s => s.cha >= 70, 'cha', '魅力突破 70，閃閃發光的萬人迷'],
  ['fat70', s => s.weight >= 70, 'weight', '體重突破 70kg，圓滾滾的身形引人注目'],
  ['fat100', s => s.weight >= 100, 'weight', '體重突破 100kg，成了巨無霸豬'],
  ['thin20', s => s.weight <= 20, 'weight', '體重降到 20kg 以下，瘦得像一道粉紅色閃電'],
  ['rich300', s => s.gold >= 300, 'gold', '豬豬幣突破 300，小富豬一枚'],
  ['broke', s => s.gold <= 0 && s.day >= 5, 'gold', '豬豬幣見底，口袋比臉還乾淨'],
];
function checkEventTrigger(s) {
  if (s.day < 2 || s.day > TOTAL_DAYS) return null;
  let found = null;
  for (const [key, cond, tag, reason] of THRESHOLDS) {
    if (cond(s) && !s.hit[key]) {
      s.hit[key] = true;               // 同時達成的門檻一起標記，避免連環觸發
      if (!found) found = { reason, tag };
    }
  }
  if (found) return found;
  if (s.day >= s.nextEventDay) return { reason: '日常突發事件', tag: null };
  return null;
}

// 內建備用事件庫在 events.js（window.PIG_EVENTS）
const LOCAL_EVENTS = (typeof window !== 'undefined' && window.PIG_EVENTS) || [];

// 把外部（AI）資料整理成安全的事件物件；格式不對就回傳 null
const EFFECT_KEY_MAP = { stamina: 'stamina', intelligence: 'int', int: 'int', strength: 'str', str: 'str', charm: 'cha', cha: 'cha', weight: 'weight', gold: 'gold' };
const EFFECT_RANGE = { stamina: [-30, 30], int: [-5, 10], str: [-5, 10], cha: [-5, 10], weight: [-6, 8], gold: [-60, 90] };
function sanitizeEffects(raw) {
  const out = {};
  if (!raw || typeof raw !== 'object') return out;
  for (const [k, v] of Object.entries(raw)) {
    const key = EFFECT_KEY_MAP[k];
    const n = Math.round(Number(v));
    if (!key || !Number.isFinite(n)) continue;
    out[key] = clamp(n, EFFECT_RANGE[key][0], EFFECT_RANGE[key][1]);
  }
  return out;
}
function sanitizeEvent(obj) {
  if (!obj || typeof obj !== 'object') return null;
  const str = (v, max) => (typeof v === 'string' ? v.trim().slice(0, max) : '');
  const title = str(obj.title, 24), story = str(obj.story, 400);
  if (!title || !story || !Array.isArray(obj.choices) || obj.choices.length < 2) return null;
  const choices = [];
  for (const c of obj.choices.slice(0, 2)) {
    if (!c) return null;
    const text = str(c.text, 60), result = str(c.result, 300);
    if (!text || !result) return null;
    choices.push({ text, result, effects: sanitizeEffects(c.effects) });
  }
  return { title, emoji: str(obj.emoji, 4) || '📮', story, choices };
}

// 解析 AI 回傳（容忍 ```json 包裹或前後多餘文字）
function parseJsonLoose(text) {
  if (typeof text !== 'string') throw new Error('not text');
  let t = text.trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b <= a) throw new Error('no json');
  return JSON.parse(t.slice(a, b + 1));
}

// 在地備用事件：避開最近出現過的、不合天氣或天數的；符合今天天氣的事件被抽中機率較高
function pickLocalEvent(s, tag) {
  const okNow = e => (!e.after || s.day >= e.after) && (!e.w || e.w.includes(s.weather));
  const recent = s.eventTitles.slice(-25);
  let pool = LOCAL_EVENTS.filter(e => okNow(e) && !recent.includes(e.title));
  if (!pool.length) pool = LOCAL_EVENTS.filter(okNow);
  const tagged = tag ? pool.filter(e => e.tag === tag) : [];
  const from = tagged.length ? tagged : pool;
  const bag = [];
  for (const e of from) { const n = e.w ? 4 : 1; for (let i = 0; i < n; i++) bag.push(e); }
  const e = pick(bag);
  const c = JSON.parse(JSON.stringify(e));
  delete c.w; delete c.after;
  return c;
}

function getMood(s) {
  if (s.sickDays > 0 || s.stamina <= 10) return 'sick';
  if (s.stamina <= 35) return 'tired';
  if (s.stamina >= 65) return 'happy';
  return 'normal';
}
function getLook(s) {
  const legend = Math.min(s.int, s.str, s.cha) >= OMNI_MIN;
  const sx = s.weight < 25 ? 0.9 : clamp(1 + (s.weight - 30) / 80, 0.9, 1.75);
  let hat = null;
  if (legend) hat = 'crown';
  else if (s.int >= 60 && s.int >= s.str) hat = 'mortar';
  else if (s.str >= 60) hat = 'helmet';
  let eyewear = null;
  if (s.cha >= 60 && s.cha >= s.int) eyewear = 'shades';
  else if (s.int >= 35) eyewear = 'glasses';
  return { legend, sx, sy: 1 + (sx - 1) * 0.13, hat, eyewear, bow: s.cha >= 35, sword: s.str >= 35, sparkle: s.cha >= 60 };
}
function getPigTitle(s) {
  if (Math.min(s.int, s.str, s.cha) >= OMNI_MIN) return '傳說級全能豬';
  if (s.weight >= 100) return '巨無霸豬';
  const m = Math.max(s.int, s.str, s.cha);
  if (m < 30) return s.weight >= 70 ? '圓滾滾小豬' : (s.weight <= 22 ? '纖瘦小豬' : '平凡小粉豬');
  if (m === s.int) return m >= 60 ? '博士豬' : '書呆小豬';
  if (m === s.str) return m >= 60 ? '騎士豬' : '肌肉小豬';
  return m >= 60 ? '偶像豬' : '人氣小豬';
}

// ---------- 音效與震動（Web Audio 即時合成，不需要任何音檔） ----------
const Sfx = (() => {
  let ctx = null, master = null;
  const rd = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const wr = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* 忽略 */ } };
  let soundOn = rd(SND_KEY) !== '0', vibOn = rd(VIB_KEY) !== '0';

  function ensure() {
    if (!soundOn) return null;
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { ctx = new AC(); master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination); } catch (e) { return null; }
    }
    if (ctx.state === 'suspended') ctx.resume().catch(() => { /* 忽略 */ });
    return ctx;
  }
  // 單音：freq 頻率、d 秒數；o.to＝滑到的頻率、o.at＝延遲幾秒
  function tone(freq, d, o = {}) {
    const t = ctx.currentTime + (o.at || 0), osc = ctx.createOscillator(), g = ctx.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol || 0.15, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    osc.connect(g); g.connect(master); osc.start(t); osc.stop(t + d + 0.03);
  }
  // 雜訊：翻書、咀嚼、重擊的質感
  function noise(d, o = {}) {
    const t = ctx.currentTime + (o.at || 0), len = Math.max(1, Math.floor(ctx.sampleRate * d));
    const buf = ctx.createBuffer(1, len, ctx.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = buf; f.type = o.filter || 'lowpass'; f.frequency.value = o.freq || 1000;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(o.vol || 0.2, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    src.connect(f); f.connect(g); g.connect(master); src.start(t); src.stop(t + d + 0.03);
  }
  const arp = (notes, step, o = {}) => notes.forEach((f, i) => tone(f, o.d || step * 1.6, Object.assign({}, o, { at: i * step })));

  const LIB = {
    tap:       () => tone(620, 0.05, { type: 'square', vol: 0.06 }),
    library:   () => { noise(0.14, { filter: 'highpass', freq: 3500, vol: 0.12 }); noise(0.12, { at: 0.17, filter: 'highpass', freq: 3000, vol: 0.1 }); tone(660, 0.15, { at: 0.08, vol: 0.07 }); },
    gym:       () => { tone(130, 0.2, { to: 55, type: 'square', vol: 0.18 }); noise(0.18, { freq: 250, vol: 0.3 }); tone(130, 0.2, { at: 0.28, to: 55, type: 'square', vol: 0.18 }); noise(0.18, { at: 0.28, freq: 250, vol: 0.3 }); },
    charm:     () => arp([784, 988, 1175, 1568], 0.09, { type: 'triangle', vol: 0.12 }),
    feast:     () => { [0, 0.11, 0.22].forEach(at => noise(0.07, { at, freq: 900, vol: 0.3 })); arp([330, 392, 523], 0.12, { at: 0.35, type: 'triangle', vol: 0.1 }); },
    work:      () => { tone(988, 0.07, { type: 'square', vol: 0.08 }); tone(1319, 0.28, { at: 0.07, type: 'square', vol: 0.08 }); },
    sleep:     () => arp([392, 330, 262, 196], 0.22, { d: 0.5, vol: 0.1 }),
    good:      () => arp([523, 659, 784], 0.09, { type: 'triangle', vol: 0.12 }),
    bad:       () => tone(220, 0.35, { to: 140, type: 'sawtooth', vol: 0.1 }),
    siren:     () => [0, 0.28, 0.56, 0.84].forEach((at, i) => tone(i % 2 ? 880 : 660, 0.26, { at, type: 'square', vol: 0.08 })),
    event:     () => { tone(880, 0.18, { vol: 0.12 }); tone(1320, 0.4, { at: 0.12, vol: 0.1 }); },
    milestone: () => arp([523, 659, 784, 1047], 0.1, { type: 'triangle', vol: 0.14, d: 0.22 }),
    unlock:    () => arp([1047, 1319, 1568, 2093, 1568, 2093], 0.07, { vol: 0.09, d: 0.18 }),
    ending:    () => { arp([523, 523, 523, 659, 587, 659, 784], 0.17, { type: 'square', vol: 0.09, d: 0.3 }); arp([261, 261, 261, 330, 293, 330, 392], 0.17, { type: 'triangle', vol: 0.1, d: 0.3 }); },
  };
  const VIB = { tap: 8, gym: [30, 40, 30], work: [15, 30, 15], good: [15, 30, 15], bad: 90, siren: [200, 80, 200, 80, 300], milestone: [20, 40, 20, 40, 60], unlock: [20, 40, 20, 40, 20, 40, 80], ending: [60, 40, 60, 40, 160], event: [20, 30, 40] };

  return {
    get sound() { return soundOn; }, get vib() { return vibOn; },
    setSound(v) { soundOn = !!v; wr(SND_KEY, soundOn ? '1' : '0'); if (soundOn) this.play('tap'); },
    setVib(v) { vibOn = !!v; wr(VIB_KEY, vibOn ? '1' : '0'); if (vibOn) this.vibrate(VIB.good); },
    vibrate(p) { if (vibOn && p && navigator.vibrate) { try { navigator.vibrate(p); } catch (e) { /* 忽略 */ } } },
    play(name) {
      try { const c = ensure(); if (c && LIB[name]) LIB[name](); } catch (e) { /* 音效失敗不影響遊戲 */ }

    },
  };
})();

function closeModal() { const o = document.getElementById('modalOverlay'); if (o) o.remove(); }
function showModal({ title = '', html = '', buttons = [], wide = false, row = false, dismiss = false }) {
  closeModal();
  const ov = document.createElement('div');
  ov.className = 'overlay'; ov.id = 'modalOverlay';
  const m = document.createElement('div');
  m.className = 'modal' + (wide ? ' wide' : '');

  const inner = document.createElement('div');

  inner.innerHTML = (title ? `<h2>${title}</h2>` : '') + `<div class="mbody">${html}</div>`;
  const bar = document.createElement('div');
  bar.className = 'modal-btns' + (row ? ' row' : '');
  buttons.forEach(b => {
    const el = document.createElement('button');
    el.className = 'mbtn ' + (b.cls || '');
    el.innerHTML = b.text;
    el.addEventListener('click', () => { Sfx.play('tap'); if (b.onClick) b.onClick(el); });
    bar.appendChild(el);
  });
  if (buttons.length) inner.appendChild(bar);
  m.appendChild(inner); ov.appendChild(m);
  if (dismiss) ov.addEventListener('click', e => { if (e.target === ov) closeModal(); });
  document.body.appendChild(ov);
  return { overlay: ov, modal: m, body: inner.querySelector('.mbody'), bar };
}
function confirmBox(title, html, okText = '確定', cancelText = '取消') {
  return new Promise(res => {
    showModal({ title, html, row: true, buttons: [
      { text: cancelText, cls: 'center', onClick: () => { closeModal(); res(false); } },
      { text: okText, cls: 'center primary', onClick: () => { closeModal(); res(true); } },
    ] });
  });
}

// ---------- Gemini ----------
async function callGemini(prompt) {
  const key = getKey();
  if (!key) throw new Error('NO_KEY');
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;
  const contents = [{ role: 'user', parts: [{ text: prompt }] }];
  // 第一組設定關閉思考以加快速度；若被拒絕（400）就退回最簡設定
  const bodies = [
    { contents, generationConfig: { responseMimeType: 'application/json', temperature: 1, maxOutputTokens: 1200, thinkingConfig: { thinkingBudget: 0 } } },
    { contents, generationConfig: { responseMimeType: 'application/json', temperature: 1 } },
  ];
  let lastErr = new Error('unknown');
  for (let i = 0; i < bodies.length; i++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 25000);
    try {
      const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key }, body: JSON.stringify(bodies[i]), signal: ctrl.signal });
      if (!r.ok) {
        lastErr = new Error('HTTP ' + r.status);
        if (r.status === 400 && i < bodies.length - 1) continue;
        throw lastErr;
      }
      const data = await r.json();
      const text = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts || []).map(p => p.text || '').join('');
      if (!text) throw new Error('EMPTY');
      return text;
    } finally { clearTimeout(timer); }
  }
  throw lastErr;
}

function aiFail(e) {
  if (!aiWarned && e && e.message !== 'NO_KEY') { aiWarned = true; toast('AI 連線失敗，改用內建內容（請檢查 API Key 與網路）', 3600); }
}

function getDeviceId() {
  try {
    let id = localStorage.getItem(DEVICE_KEY);
    if (!id || !/^[A-Za-z0-9_-]{16,64}$/.test(id)) {
      const b = new Uint8Array(18); crypto.getRandomValues(b);
      id = Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
      localStorage.setItem(DEVICE_KEY, id);
    }
    return id;
  } catch (e) { return null; }
}

function addLocalScore(entry) {
  const board = loadLocalBoard();

  board.sort((a, b) => b.score - a.score || a.at - b.at);
  if (board.length > 30) board.length = 30;
  saveLocalBoard(board);
  const i = board.findIndex(x => x.id === entry.id);
  return i < 0 ? null : i + 1;
}

async function lbFetch(path, opt) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);
  try {
    const r = await fetch(LB_URL + path, Object.assign({ signal: ctrl.signal }, opt));
    let data = null;
    try { data = await r.json(); } catch (e) { /* 非 JSON */ }
    if (!r.ok) throw new Error((data && data.error) || ('HTTP ' + r.status));
    return data;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('連線逾時');
    throw e;
  } finally { clearTimeout(timer); }
}

        <div class="sub">${esc(n.subhead || '')}</div>
        <div class="body">${paras}</div>
        <div class="quote">「${esc(n.quote || e.quote)}」—— 受訪豬豬</div>
      </div>
      <p style="margin:8px 0 0"><b>🐷 豬豬暱稱</b>（排行榜顯示用）</p>
      <input class="field" id="nameInput" maxlength="${NAME_MAX}" autocomplete="off" placeholder="最多 ${NAME_MAX} 個字" value="${esc(getPlayerName())}" ${up ? 'disabled' : ''}>
      <p class="small" style="text-align:center">已解鎖結局 ${unlocked} / ${ENDINGS.length}${LB_URL ? '' : '｜尚未設定線上排行榜，成績只會記在這台裝置'}</p>`,
    buttons,
  });
  m.body.querySelector('.endpig').appendChild(clone);
  // 暱稱改了就同步到本機排行榜這一局
  const ni = $('nameInput');
  if (ni && !up) ni.addEventListener('change', () => { const nm = cleanName(ni.value); if (nm) { setPlayerName(nm); renameLocalRun(s.runId, nm); } });
}

// ---------- 排行榜畫面 ----------
function lbRows(list, mark) {
  if (!list.length) return '<div class="lb-empty">還沒有任何成績，快去通關一次吧！🐷</div>';
  const medal = r => (r === 1 ? '🥇' : r === 2 ? '🥈' : r === 3 ? '🥉' : r);
  return `<table class="lb"><thead><tr><th>名次</th><th>豬豬</th><th class="r">分數</th></tr></thead><tbody>${list.map((x, i) => {
    const e = ENDINGS.find(t => t.id === x.endingId);
    const rank = x.rank || i + 1;
    return `<tr class="${mark && mark === x.id ? 'me' : ''}"><td class="rk">${medal(rank)}</td>
      <td class="nm">${esc(x.name)}<span class="sub">${e ? e.emoji + ' ' + esc(e.title) : ''}｜智${x.int} 力${x.str} 魅${x.cha}｜${x.weight}kg｜${x.gold}G</span></td>
      <td class="r"><b>${x.score}</b></td></tr>`;
  }).join('')}</tbody></table>`;
}
function showLeaderboard(fromEnding = false, tab) {
  tab = tab || (LB_URL ? 'online' : 'local');
  const m = showModal({
    wide: true, dismiss: !fromEnding, row: true,
    title: '🏆 豬豬排行榜',
    html: `<div class="tabs"><button class="tab ${tab === 'local' ? 'on' : ''}" data-t="local">📱 本機</button><button class="tab ${tab === 'online' ? 'on' : ''}" data-t="online">🌐 線上</button></div>
      <div id="lbBody"></div>
      <p class="small" style="text-align:center">分數 ＝ 智慧＋力量＋魅力 ＋ 豬豬幣÷10（最多 100）＋ 結局稀有度（每顆星 40，隱藏結局再 +50）</p>`,
    buttons: [{ text: fromEnding ? '← 回到結局' : '關閉', cls: 'center primary', onClick: () => { if (fromEnding && state.ended) showEnding(); else closeModal(); } }],
  });
  m.body.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => showLeaderboard(fromEnding, b.dataset.t)));
  const box = m.body.querySelector('#lbBody');
  if (tab === 'local') { box.innerHTML = lbRows(loadLocalBoard(), state && state.runId); return; }
  if (!LB_URL) { box.innerHTML = '<div class="lb-empty">這個版本還沒有設定線上排行榜。<br><span class="small">管理員部署好排行榜伺服器後，在 config.js 填入網址即可開啟。</span></div>'; return; }
  box.innerHTML = '<div class="spinner"></div>';
  fetchOnlineBoard().then(d => {
    if (!document.body.contains(box)) return;     // 使用者已切換或關閉
    box.innerHTML = lbRows(Array.isArray(d.scores) ? d.scores : [], null);
  }).catch(err => {
    if (!document.body.contains(box)) return;
    box.innerHTML = `<div class="lb-empty">讀取失敗：${esc(err.message)}<br><span class="small">請檢查網路後再試。</span></div>`;
  });
}

function showBook(fromEnding = false) {
  const book = loadBook();
  const cards = ENDINGS.map(e => {
    const got = book[e.id];
    if (!got) return `<div class="bcard locked"><div class="e">❓</div><div class="t">？？？</div><div class="stars">${'★'.repeat(e.stars)}</div><div>${e.hidden ? '隱藏結局' : '尚未解鎖'}</div></div>`;
    return `<div class="bcard"><div class="e">${e.emoji}</div><div class="t">${esc(e.title)}</div><div class="stars">${'★'.repeat(e.stars)}</div><div>${esc(e.hint)}</div><div class="small">達成 ${got.count} 次</div></div>`;
  }).join('');
  showModal({
    wide: true, dismiss: !fromEnding, row: true,
    title: `📖 結局圖鑑（${Object.keys(book).length} / ${ENDINGS.length}）`,
    html: `<div class="book-grid">${cards}</div>`,
    buttons: [{ text: fromEnding ? '← 回到結局' : '關閉', cls: 'center primary', onClick: () => { if (fromEnding && state.ended) showEnding(); else closeModal(); } }],
  });
}

// ---------- 設定／說明／重新開始 ----------
function showSettings() {
  const hasKey = !!getKey();
  const iosHint = /iphone|ipad|ipod/i.test(navigator.userAgent) ? '<p class="small">📱 iPhone / iPad：在 Safari 點「分享」→「加入主畫面」即可安裝。</p>' : '';
  const m = showModal({
    title: '⚙️ 設定', dismiss: true,
    html: `
      <p><label><input type="checkbox" id="optSnd" ${Sfx.sound ? 'checked' : ''}> 🔊 音效</label>　<label><input type="checkbox" id="optVib" ${Sfx.vib ? 'checked' : ''}> 📳 震動（支援的手機）</label></p>
      <p><b>Gemini API Key</b>（選填）</p>
      <p class="small">填入後，突發事件與結局報導會由 <code>${MODEL}</code> 即時生成；不填則使用內建內容。金鑰只會存在這台裝置的瀏覽器，並直接傳送給 Google。<br>
      取得方式：<a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a></p>
      <input class="field" id="keyInput" type="password" autocomplete="off" placeholder="${hasKey ? '已設定（輸入新值可覆蓋）' : '貼上你的 API Key'}">
      ${iosHint}
      <p class="small">目前狀態：${hasKey ? '✅ 已設定 API Key' : '⚪ 尚未設定（使用內建事件）'}</p>`,
    buttons: [
      { text: '💾 儲存', cls: 'center primary', onClick: () => {
        const v = $('keyInput').value.trim();
        if (v) { try { localStorage.setItem(API_KEY_STORE, v); } catch (e) { /* 忽略 */ } aiWarned = false; toast('已儲存 API Key'); }
        closeModal();
      } },
      { text: '🗑️ 清除 Key', cls: 'center', onClick: () => { try { localStorage.removeItem(API_KEY_STORE); } catch (e) { /* 忽略 */ } toast('已清除 API Key'); closeModal(); } },
      { text: '關閉', cls: 'center', onClick: closeModal },
    ],
  });
  $('optSnd').addEventListener('change', e => { Sfx.setSound(e.target.checked); refreshSoundBtn(); });
  $('optVib').addEventListener('change', e => Sfx.setVib(e.target.checked));
  return m;
}
function showIntro() {
  showModal({
    title: '🐷 歡迎來到豬豬夢工場！',
    html: `<div class="big">🌾🐖🌾</div>
      <p>你有 <b>30 天</b>，要把這隻普通的小粉豬養成<b>獨當一面的傳奇豬豬</b>！</p>
      <p>每天選 <b>1 個行動</b>：讀書、健身、練儀態、大吃大喝、打工，或睡覺回血。體力歸零會昏倒住院，記得量力而為。</p>
      <p>途中會遇到<b>突發事件</b>，你的選擇會影響數值。第 30 天結束後，依最終數值解鎖專屬結局與報紙頭條！</p>
      <p class="small">🏆 一共有 ${ENDINGS.length} 種結局等你收集。</p>`,
    buttons: [{ text: '開始養成 ▶', cls: 'center primary', onClick: () => { closeModal(); say('今天要做什麼呢？'); } }],
  });
}
async function restart() {
  if (busyFlag) return;
  if (!state.ended) {
    const ok = await confirmBox('🔄 重新開始？', '目前的養成進度會消失，但<b>結局圖鑑</b>會保留。', '重新開始', '取消');
    if (!ok) return;
  }
  state = newState();
  save(); setBusy(false); closeModal(); renderAll(); say('新的豬生，開始囉！'); showIntro();
}

// ---------- 啟動 ----------
async function init() {
  state = loadState() || newState();
  buildStats(); renderAll();
  refreshSoundBtn();
  $('btnSound').addEventListener('click', () => { Sfx.setSound(!Sfx.sound); refreshSoundBtn(); });
  $('btnRank').addEventListener('click', () => showLeaderboard(false));
  $('btnBook').addEventListener('click', () => showBook(false));
  $('btnSettings').addEventListener('click', showSettings);
  $('btnRestart').addEventListener('click', restart);
  $('btnInstall').addEventListener('click', async () => {
    if (!deferredInstall) return;
    deferredInstall.prompt();
    try { await deferredInstall.userChoice; } catch (e) { /* 忽略 */ }
    deferredInstall = null; $('btnInstall').hidden = true;
  });
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; $('btnInstall').hidden = false; });
  window.addEventListener('appinstalled', () => { $('btnInstall').hidden = true; toast('已加到主畫面 🎉'); });

  if (state.ended) { setBusy(true); await showEnding(); setBusy(false); return; }
  if (state.pendingEvent) {          // 事件進行到一半就關掉頁面時，接續顯示
    setBusy(true);
    await presentEvent(state.pendingEvent);
    state.pendingEvent = null; save(); setBusy(false); renderAll();
    return;
  }
  if (state.day === 1 && state.log.length === 0) showIntro();
}

if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => { /* 離線功能失敗不影響遊玩 */ }));
}
init();
</script>
</body>
</html>
