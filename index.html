<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>豬豬夢工場：30天豬生逆襲</title>
<meta name="description" content="30 天把一隻普通小粉豬養成傳奇豬豬！繁體中文養成遊戲，含 7 種豬豬個性、心情、NPC 好感、道具商店、每日固定挑戰、天氣與成就。">
<meta name="theme-color" content="#8b5a2b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="豬豬夢工場">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* ===== 基本設定 ===== */
:root{
  --paper:#fff3c4; --ink:#4a3320;
  --wood1:#9a6a3a; --wood2:#7f5329; --wood-dark:#4b2f14;
  --green:#6cc04a; --yellow:#f5c542; --red:#e8584f; --blue:#4c9be8; --pink:#f06fa0; --orange:#f08a3c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;
  color:var(--ink);
  background-color:#8fd16b;
  background-image:radial-gradient(#7cc15a 2px,transparent 2.5px);
  background-size:24px 24px;
  line-height:1.5;
}
button{font-family:inherit}
#app{max-width:1100px;margin:0 auto;padding:10px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}

/* ===== 木頭質感邊框 ===== */
.wood{
  background:repeating-linear-gradient(92deg,#9a6a3a 0 7px,#8a5c2f 7px 9px,#a3733f 9px 17px,#7f5329 17px 18px);
  border-radius:14px;padding:10px;
  box-shadow:inset 0 0 0 2px #5e3b1b,inset 0 0 0 4px rgba(255,220,160,.25),0 5px 0 var(--wood-dark),0 8px 14px rgba(0,0,0,.25);
}

/* ===== 頂部列 ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;padding:8px 12px}
.topbar h1{margin:0;font-size:1.25rem;color:#fff3c4;text-shadow:2px 2px 0 #4b2f14;letter-spacing:1px;line-height:1.2}
.topbar h1 small{display:block;font-size:.72rem;color:#ffe29a;letter-spacing:0;font-weight:600}
.topbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tbtn{border:2px solid var(--wood-dark);background:#fff3c4;color:var(--ink);border-radius:8px;padding:5px 9px;font-size:.85rem;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--wood-dark)}
.tbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--wood-dark)}

/* ===== 版面：左邊豬豬、右邊筆記本 ===== */
.layout{display:grid;grid-template-columns:minmax(300px,430px) 1fr;gap:16px;align-items:start}
.stage{position:sticky;top:10px}
@media (max-width:620px){
  .tbtn .lbl{display:none}
  .tbtn{padding:5px 9px;font-size:1.05rem}
  .topbar{flex-direction:column;align-items:stretch;gap:6px}
  .topbtns{justify-content:center}
  .topbar h1{white-space:nowrap}
}
@media (max-width:780px){
  .layout{grid-template-columns:1fr}
  .stage{position:static}
  .topbar h1{font-size:1.05rem}
}

/* ===== 豬豬舞台 ===== */
.stage-view{position:relative}
#pigSvg{width:100%;height:auto;display:block;border:3px solid var(--wood-dark);border-radius:10px;background:#bfe9ff}
.badges{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:5px;align-items:flex-end;z-index:2}
.badge{background:#fff8dc;border:3px solid var(--wood-dark);border-radius:8px;padding:1px 9px;font-weight:800;font-size:.95rem;box-shadow:0 3px 0 var(--wood-dark)}
.bubble{
  position:absolute;left:10px;top:10px;max-width:56%;z-index:2;
  background:#fff;border:3px solid var(--wood-dark);border-radius:12px;padding:5px 10px;font-size:.85rem;font-weight:700;
  box-shadow:0 3px 0 rgba(75,47,20,.6);
}
.bubble::after{content:"";position:absolute;left:26px;bottom:-12px;border:6px solid transparent;border-top:9px solid var(--wood-dark)}
.pigtag{
  display:inline-block;margin:10px 0 8px;padding:3px 12px;border:3px solid var(--wood-dark);border-radius:6px;
  background:#ffe29a;font-weight:900;box-shadow:0 3px 0 var(--wood-dark)
}
.stats{background:#fff3c4;border:3px solid #5e3b1b;border-radius:10px;padding:8px 10px}
.stat{display:grid;grid-template-columns:76px 1fr 74px;align-items:center;gap:8px;padding:3px 0}
.relations{margin-top:8px;padding:7px 9px;border:2px dashed #9b7540;border-radius:8px;background:#fff8dc;font-size:.82rem;font-weight:800}
.relations .relrow{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
.relations .relbar{height:7px;background:#e0d1a8;border-radius:5px;overflow:hidden;margin-top:2px}
.relations .relfill{height:100%;background:#f06fa0;transition:width .35s}
.mode-note{font-size:.75rem;color:#7a6040;text-align:center;margin:6px 0}
.shop-list{display:grid;gap:8px}.shop-card{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;padding:8px;border:2px solid #7f5329;border-radius:8px;background:#fffaf0}.shop-card b{display:block}.shop-card .small{display:block}.shop-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.shop-actions .mbtn{font-size:.82rem;padding:5px 8px}
/* ===== 豬豬個性 ===== */
.badge.pers{background:#ffe6f1;cursor:pointer}
.badge.pers:hover{filter:brightness(1.03)}
.pers-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:8px;margin:8px 0 10px}
.pers-card{
  display:flex;flex-direction:column;gap:3px;text-align:left;padding:8px;border:3px solid #5e3b1b;border-radius:8px;
  background:#fffaf0;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #5e3b1b;font-size:.8rem;line-height:1.35;
  transition:transform .06s,box-shadow .06s,background .15s;
}
.pers-card:hover{background:#fff}
.pers-card:active{transform:translateY(3px);box-shadow:0 1px 0 #5e3b1b}
.pers-card .e{font-size:1.7rem;line-height:1.1}
.pers-card .t{font-weight:900;font-size:.95rem}
.pers-card .tag{font-size:.72rem;color:#7a6040}
.pers-card .pro{font-size:.74rem;color:#2f8a1a;font-weight:700}
.pers-card .con{font-size:.74rem;color:#c23a30;font-weight:700}
.pers-card.on{background:#ffe9a8;border-color:#c25a00;box-shadow:0 3px 0 #c25a00,0 0 0 3px rgba(255,217,90,.6)}
.pers-card .collected{font-size:.7rem;color:#8a6a3a}
.pers-detail{margin:6px 0 0;padding:8px 10px;border:2px dashed #9b7540;border-radius:8px;background:#fff8dc;font-size:.82rem}
.pers-detail b{display:block;margin-bottom:2px}
.stat .lbl{font-weight:800;font-size:.9rem;white-space:nowrap}
.bar{position:relative;height:16px;background:#d9c79a;border:2px solid #5e3b1b;border-radius:5px;overflow:hidden}
.fill{position:relative;height:100%;width:0;transition:width .5s ease,background .3s}
.fill::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(255,255,255,.28) 6px 8px)}
.val{position:relative;font-weight:800;font-size:.9rem;text-align:right;white-space:nowrap}
.delta{position:absolute;right:0;top:-14px;font-size:.85rem;font-weight:900;opacity:0;pointer-events:none}
.delta.show{animation:deltaPop 1.3s ease-out}
.delta.up{color:#2f8a1a}.delta.down{color:#c23a30}
@keyframes deltaPop{0%{opacity:0;transform:translateY(8px)}15%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}

/* ===== 筆記本 ===== */
.paper{
  position:relative;padding:14px 14px 16px 50px;border:3px solid #d9bd6a;border-radius:8px;background-color:var(--paper);
  background-image:
    repeating-linear-gradient(to bottom,transparent 0,transparent 27px,rgba(110,150,200,.33) 27px,rgba(110,150,200,.33) 28px),
    linear-gradient(90deg,transparent 36px,rgba(220,90,90,.45) 36px,rgba(220,90,90,.45) 38px,transparent 38px);
}
.paper::before{
  content:"";position:absolute;left:9px;top:12px;bottom:12px;width:16px;
  background:radial-gradient(circle at 8px 8px,#6b4a2b 0 5px,transparent 5.5px) 0 0/16px 30px repeat-y;
}
.paper h2{margin:0 0 10px;font-size:1.15rem}
.paper h3{margin:16px 0 6px;font-size:1rem}
.hint{font-size:.8rem;color:#7a6040;margin:2px 0 10px}

.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.act{
  text-align:left;padding:9px 10px;border:3px solid var(--wood-dark);border-radius:8px;background:#fffaf0;color:var(--ink);
  box-shadow:0 4px 0 var(--wood-dark);cursor:pointer;display:flex;flex-direction:column;gap:5px;font-size:1rem;
  transition:transform .06s,box-shadow .06s,background .15s;
}
.act:hover{background:#fff}
.act:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood-dark)}
.act:disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.45)}
.act .name{font-weight:900}
.act.danger{border-color:#b3302a;box-shadow:0 4px 0 #b3302a}
.act .warn{font-size:.74rem;color:#b3302a;font-weight:800}
.act .weather-note{font-size:.74rem;color:#2874a6;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:.72rem;padding:0 6px;border-radius:10px;border:1px solid;font-weight:800;white-space:nowrap}
.chip.up{background:#e3f7d8;border-color:#7cbf5a;color:#2f7a1a}
.chip.down{background:#fde4e1;border-color:#e58a82;color:#a3322a}
body.busy .act{pointer-events:none;opacity:.6}

.log{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto}
.log li{padding:3px 0;font-size:.88rem;border-bottom:1px dashed rgba(120,90,50,.3)}
.log .d{display:inline-block;min-width:3.4em;font-weight:900;color:#a06a2a}
.log li.ev{color:#7a2f8a}
.log li.bad{color:#b3302a}

/* ===== 彈窗 ===== */
.overlay{position:fixed;inset:0;background:rgba(40,25,10,.62);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{
  width:min(560px,100%);max-height:92vh;overflow:auto;border-radius:14px;padding:10px;
  background:repeating-linear-gradient(92deg,#9a6a3a 0 7px,#8a5c2f 7px 9px,#a3733f 9px 17px,#7f5329 17px 18px);
  box-shadow:inset 0 0 0 2px #5e3b1b,0 8px 0 var(--wood-dark),0 14px 30px rgba(0,0,0,.4);animation:pop .22s ease-out;
}
.modal.wide{width:min(760px,100%)}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.modal-inner{background:var(--paper);border:3px solid #d9bd6a;border-radius:8px;padding:14px 16px}
.modal h2{margin:0 0 8px;font-size:1.25rem;text-align:center}
.modal .big{font-size:2.6rem;text-align:center;line-height:1.1}
.modal p{margin:6px 0}
.modal-btns{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.modal-btns.row{flex-direction:row;flex-wrap:wrap;justify-content:center}
.mbtn{
  border:3px solid var(--wood-dark);border-radius:8px;background:#fffaf0;color:var(--ink);padding:9px 12px;font-size:1rem;font-weight:800;
  cursor:pointer;box-shadow:0 4px 0 var(--wood-dark);text-align:left
}
.mbtn.center{text-align:center}
.mbtn.primary{background:#ffd95a}
.mbtn:hover{filter:brightness(1.05)}
.mbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wood-dark)}
.spinner{width:38px;height:38px;border:5px solid #e0c080;border-top-color:#8b5a2e;border-radius:50%;animation:spin 1s linear infinite;margin:12px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.small{font-size:.8rem;color:#7a6040}
.tag-ai{display:inline-block;font-size:.7rem;padding:0 7px;border-radius:9px;background:#e7d7ff;color:#5a2d91;font-weight:800;margin-left:6px;vertical-align:middle}
.tag-local{background:#e0e0e0;color:#555}
.field{width:100%;padding:8px;border:2px solid #5e3b1b;border-radius:6px;font-size:1rem;background:#fff;margin:6px 0}

/* ===== 報紙 ===== */
.news{
  background:#f3e8c9;border:2px solid #3b3025;padding:10px 14px 14px;margin:8px 0;
  font-family:"Noto Serif TC","Songti TC","PMingLiU","Source Han Serif TC",serif;color:#2b2218;
  box-shadow:3px 3px 0 rgba(0,0,0,.2);transform:rotate(-.6deg)
}
.news .mast{text-align:center;font-size:1.7rem;font-weight:900;letter-spacing:.35em;border-bottom:4px double #3b3025;padding-bottom:4px}
.news .meta{display:flex;justify-content:space-between;font-size:.72rem;border-bottom:1px solid #3b3025;padding:3px 0;margin-bottom:8px}
.news .head{font-size:1.55rem;font-weight:900;line-height:1.25;margin:6px 0 2px}
.news .sub{font-size:.95rem;font-weight:700;margin-bottom:8px;color:#5a4630}
.news .body{font-size:.92rem;line-height:1.75;text-align:justify}
.news .body p{margin:0 0 6px;text-indent:2em}
.news .quote{margin-top:8px;padding:6px 10px;border-left:4px solid #3b3025;font-style:italic;background:rgba(0,0,0,.05)}

/* ===== 圖鑑 ===== */
.book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:8px}
.bcard{border:3px solid #5e3b1b;border-radius:8px;background:#fffaf0;padding:8px;text-align:center;font-size:.82rem}
.bcard .e{font-size:2rem}
.bcard .t{font-weight:900;font-size:.95rem}
.bcard.locked{background:#d8cdb0;color:#7a6a4a}
.bcard.locked .e{filter:grayscale(1) brightness(.5)}
/* 排行榜 */
.scorebox{margin:8px 0;padding:6px 10px;border:3px solid #5e3b1b;border-radius:8px;background:#fff7d6;text-align:center;font-weight:800}
.scorebox b{font-size:1.5rem;color:#c25a00}
.scorebox small{display:block;font-weight:600;color:#7a6040;font-size:.75rem}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:8px}
.tab{border:3px solid var(--wood-dark);border-radius:8px;background:#fffaf0;padding:3px 14px;font-weight:800;cursor:pointer;box-shadow:0 3px 0 var(--wood-dark)}
.tab.on{background:#ffd95a}
.lb{width:100%;border-collapse:collapse;font-size:.88rem}
.lb th,.lb td{padding:5px 6px;border-bottom:1px dashed rgba(120,90,50,.4);text-align:left}
.lb th{font-size:.78rem;color:#7a6040}
.lb td.r{text-align:right;white-space:nowrap}
.lb tr.me{background:#fff0a8}
.lb .rk{font-weight:900;white-space:nowrap;width:2.6em}
.lb .nm{font-weight:800;word-break:break-all}
.lb .sub{display:block;font-size:.72rem;color:#7a6040;font-weight:600}
.lb-empty{text-align:center;padding:16px 4px}
.stars{color:#e0a000;letter-spacing:1px}

.endpig{width:min(220px,60%);margin:0 auto;display:block}
.endpig svg{width:100%;height:auto;border:3px solid var(--wood-dark);border-radius:10px;display:block}
.sumrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0}
.sumrow span{background:#fff;border:2px solid #5e3b1b;border-radius:8px;padding:1px 8px;font-weight:800;font-size:.85rem}

.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#4b2f14;color:#fff3c4;padding:8px 16px;border-radius:20px;font-weight:700;z-index:80;box-shadow:0 4px 12px rgba(0,0,0,.35);max-width:90vw;text-align:center}
.update-prompt{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;width:min(520px,calc(100vw - 24px));padding:10px 12px;background:#fff3c4;color:#4b2f14;border:3px solid #5e3b1b;border-radius:10px;box-shadow:0 5px 16px rgba(0,0,0,.32);z-index:90;font-weight:800}
.update-prompt span{flex:1}.update-prompt button{border:2px solid #5e3b1b;border-radius:7px;padding:6px 10px;background:#f6c744;color:#4b2f14;font:inherit;cursor:pointer;white-space:nowrap}.update-prompt button:hover{filter:brightness(1.05)}

/* ===== 豬豬動畫 ===== */
.breathe{transform-box:fill-box;transform-origin:50% 100%;animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.012,1.03)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.4s infinite}
@keyframes blink{0%,91%,100%{transform:scaleY(1)}94%{transform:scaleY(.08)}}
.heart{animation:floatUp 2.6s ease-in infinite;transform-box:fill-box;transform-origin:center}
.heart.h2{animation-delay:.9s}.heart.h3{animation-delay:1.7s}
@keyframes floatUp{0%{transform:translateY(8px) scale(.5);opacity:0}25%{opacity:1}100%{transform:translateY(-34px) scale(1.1);opacity:0}}
.drop{animation:dropFall 1.8s ease-in infinite;transform-box:fill-box;transform-origin:center}
.drop.d2{animation-delay:.9s}
@keyframes dropFall{0%{transform:translateY(-4px);opacity:0}25%{opacity:1}100%{transform:translateY(20px);opacity:0}}
.twinkle{animation:twinkle 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.twinkle.t2{animation-delay:.6s}
@keyframes twinkle{0%,100%{transform:scale(.4);opacity:.3}50%{transform:scale(1.2);opacity:1}}
/* 天氣畫面（只影響外觀，規則仍由 WEATHER 決定）。用 class 而不是 id，結局頁複製出的豬豬圖才不會失效 */
.pigsvg .sky0{stop-color:#9bdcff;transition:stop-color 1s}
.pigsvg .sky1{stop-color:#fff2c9;transition:stop-color 1s}
.sunG{transition:opacity 1s}
.pigsvg[data-wx=cloudy] .sky0{stop-color:#b9c9d6}
.pigsvg[data-wx=cloudy] .sky1{stop-color:#eef0ea}
.pigsvg[data-wx=rainy] .sky0{stop-color:#7f93a8}
.pigsvg[data-wx=rainy] .sky1{stop-color:#c9d3d8}
.pigsvg[data-wx=windy] .sky0{stop-color:#a8e1e6}
.pigsvg[data-wx=windy] .sky1{stop-color:#f4f7de}
.pigsvg[data-wx=cloudy] .sunG,.pigsvg[data-wx=rainy] .sunG{opacity:0}
.pigsvg[data-wx=windy] .sunG{opacity:.85}
.pigsvg[data-wx=cloudy] .cloud ellipse{fill:#dfe5ea}
.pigsvg[data-wx=rainy] .cloud ellipse{fill:#8e9aa8}
.pigsvg[data-wx=windy] .cloud.c1,.pigsvg[data-wx=windy] .cloud.c2{animation-duration:8s}
.wx-drop{animation:wxFall linear infinite}
@keyframes wxFall{from{transform:translateY(-30px)}to{transform:translateY(360px)}}
.wx-leaf{animation:wxLeaf linear infinite}
@keyframes wxLeaf{0%{transform:translate(-30px,0) rotate(0)}25%{transform:translate(70px,-14px) rotate(120deg)}50%{transform:translate(170px,10px) rotate(260deg)}75%{transform:translate(270px,-10px) rotate(400deg)}100%{transform:translate(380px,6px) rotate(540deg)}}
.cloud{animation:drift 26s linear infinite alternate}
.cloud.c2{animation-duration:34s}
@keyframes drift{from{transform:translateX(-14px)}to{transform:translateX(26px)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(.94);opacity:.85}50%{transform:scale(1.04);opacity:1}}
.skin{fill:var(--skin);stroke:var(--line);stroke-width:3;stroke-linejoin:round}
.snout{fill:var(--snout);stroke:var(--line);stroke-width:3}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <header class="topbar wood">
    <h1>🐷 豬豬夢工場<small>30 天豬生逆襲</small></h1>
    <div class="topbtns">
      <button class="tbtn" id="btnInstall" title="安裝到主畫面" aria-label="安裝到主畫面" hidden>📲<span class="lbl"> 安裝</span></button>
      <button class="tbtn" id="btnSound" title="音效開關" aria-label="音效開關">🔊</button>
      <button class="tbtn" id="btnRank" title="排行榜" aria-label="排行榜">🏆<span class="lbl"> 排行榜</span></button>
      <button class="tbtn" id="btnDaily" title="每日挑戰" aria-label="每日挑戰">📅<span class="lbl"> 每日挑戰</span></button>

}

// 把數值變化套進狀態並做上下限控制，回傳「實際」變動量
function applyDelta(s, d) {
  const real = {};
  for (const k of KEYS) {
    if (!d[k]) continue;
    const before = s[k];
    s[k] = clamp(before + d[k], LIMITS[k][0], LIMITS[k][1]);
    real[k] = s[k] - before;
  }
  return real;
}

function newState(options = {}) {
  const mode = options.mode === 'daily' ? 'daily' : 'normal';
  const challengeDate = mode === 'daily' ? options.challengeDate : null;
  const seed = mode === 'daily' ? ((Number(options.seed) >>> 0) || PigCore.dailySeed(challengeDate) || 1) : null;
  const bonus = mode === 'daily' ? { int: 0, str: 0, cha: 0 } : getAchievementMeta().bonuses;
  const personality = PigPersonalities.has(options.personality)
    ? options.personality
    : (mode === 'daily' ? DEFAULT_PERSONALITY : null);
  const s = {
    v: 1, mode, challengeDate, seed, rngState: seed, dailyEventOrder: [], dailyEventIndex: 0,
    personality,
    day: 1, stamina: 100, int: 10 + bonus.int, str: 10 + bonus.str, cha: 10 + bonus.cha, weight: 30, gold: 100, mood: 70,
    lastActionId: null, sameActionStreak: 0, relationships: { teacher: 0, truffle: 0 }, inventory: {},
    sickDays: 0, nextEventDay: mode === 'daily' ? 3 : 0, hit: {}, eventTitles: [], log: [],
    pendingEvent: null, ended: false, endingId: null, news: null, hospitalCount: 0, aiEvents: 0,
    weather: null, weatherSeen: [], noSleepStreak: 0, bestNoSleepStreak: 0, newAchievements: [],
  };
  // 個性的開局加成與專屬道具（每日挑戰不套用，維持全球一致）
  if (mode !== 'daily' && personality) {
    const p = getPersonality(s);
    for (const [k, v] of Object.entries(p.startBonus || {})) {
      if (k in LIMITS) s[k] = clamp(s[k] + v, LIMITS[k][0], LIMITS[k][1]);
    }
    for (const [id, n] of Object.entries(p.startItems || {})) s.inventory[id] = (s.inventory[id] || 0) + n;
  }
  if (mode === 'daily') s.dailyEventOrder = seededShuffle(LOCAL_EVENTS.map(e => e.title), seed);
  s.weather = rollWeather(s);
  s.weatherSeen = [s.weather];
  if (mode !== 'daily') {
    const span = getPersonality(s).eventInterval || [3, 4];
    s.nextEventDay = rand(span[0], span[1], s);
  }
  return s;
}

function weatherAction(a, weather = state && state.weather) {
  if (a.id === 'work' && weather === 'sunny') {
    return Object.assign({}, a, { delta: Object.assign({}, a.delta, { gold: a.delta.gold + 20 }) });
  }
  return a;
}
function isWeatherBlocked(a, weather = state && state.weather) { return a.id === 'gym' && weather === 'rainy'; }

// 個性換算後的「確定性」增減（不含隨機成長），供按鈕預覽與判斷使用
function effectiveDelta(s, a) {
  const p = getPersonality(s);
  const d = Object.assign({}, a.delta);
  if (d.stamina) d.stamina = PigPersonalities.scaleStamina(p, d.stamina);
  if (d.gold) d.gold = PigPersonalities.scaleGold(p, d.gold);
  if (d.weight) d.weight = PigPersonalities.scaleWeight(p, d.weight);
  const bonus = (p.actionBonus || {})[a.id];
  if (bonus) for (const [k, v] of Object.entries(bonus)) d[k] = (d[k] || 0) + v;
  return d;
}
// 檢查這一步能不能做：金幣是否足夠
function canAfford(s, a) { return s.gold + (effectiveDelta(s, a).gold || 0) >= 0; }
// 做了之後體力會不會歸零（歸零會昏倒）
function willCollapse(s, a) { return s.stamina + (effectiveDelta(s, a).stamina || 0) <= 0; }

// 執行行動（純邏輯）：體力偏低或病後虛弱時，成長打七折；個性再調整消耗與成長
function runAction(s, a) {
  const p = getPersonality(s);
  const d = effectiveDelta(s, a);
  if (!Number.isFinite(s.mood)) s.mood = 70;
  const repeated = s.lastActionId === a.id;
  const actionMood = { sleep: 10, feast: 7, work: -3 }[a.id] || 0;
  // repeatTolerance 越小＝越能忍受重複（慵懶小豬）
  const repeatMood = repeated ? Math.round(-12 * (Number(p.repeatTolerance) || 1)) : 5;
  d.mood = (d.mood || 0) + repeatMood + actionMood + (Number(p.moodPerAction) || 0);
  let weak = false, lowMood = s.mood < 25;
  if (a.main) {
    let g = rand(a.range[0], a.range[1], s);
    if (s.stamina < 25 || s.sickDays > 0) { g = Math.max(1, Math.round(g * 0.7)); weak = true; }
    if (lowMood) { g = Math.max(1, Math.round(g * 0.75)); weak = true; }
    else if (s.mood >= 80) g += 1;
    g = Math.max(1, Math.round(g * PigPersonalities.growthFor(p, a.main)));
    d[a.main] = (d[a.main] || 0) + g;
  }
  s.sameActionStreak = repeated ? (s.sameActionStreak || 1) + 1 : 1;
  s.lastActionId = a.id;
  return { real: applyDelta(s, d), weak, lowMood, personality: p };
}

// 昏倒住院：扣醫藥費、恢復體力、病後虛弱
function hospitalize(s) {
  const fee = Math.min(s.gold, 40);
  s.gold -= fee;
  s.stamina = 60;
  s.sickDays = 1;
  s.hospitalCount++;
  return { fee };
}

const THRESHOLDS = [
  ['int40', s => s.int >= 40, 'int', '智慧突破 40，成了牧場的小天才'],
  ['int70', s => s.int >= 70, 'int', '智慧突破 70，名聲傳遍各個牧場'],

  ['cha70', s => s.cha >= 70, 'cha', '魅力突破 70，閃閃發光的萬人迷'],
  ['fat70', s => s.weight >= 70, 'weight', '體重突破 70kg，圓滾滾的身形引人注目'],
  ['fat100', s => s.weight >= 100, 'weight', '體重突破 100kg，成了巨無霸豬'],
  ['thin20', s => s.weight <= 20, 'weight', '體重降到 20kg 以下，瘦得像一道粉紅色閃電'],
  ['rich300', s => s.gold >= 300, 'gold', '豬豬幣突破 300，小富豬一枚'],
  ['broke', s => s.gold <= 0 && s.day >= 5, 'gold', '豬豬幣見底，口袋比臉還乾淨'],
];
function checkEventTrigger(s) {
  if (s.day < 2 || s.day > TOTAL_DAYS) return null;
  if (s.mode === 'daily') {
    if (s.day >= s.nextEventDay) {
      const index = s.dailyEventIndex || 0;
      s.dailyEventIndex = index + 1;
      return { reason: '每日挑戰固定事件', tag: null, dailyEventIndex: index };
    }
    return null;
  }
  let found = null;
  for (const [key, cond, tag, reason] of THRESHOLDS) {
    if (cond(s) && !s.hit[key]) {
      s.hit[key] = true;               // 同時達成的門檻一起標記，避免連環觸發
      if (!found) found = { reason, tag };
    }
  }
  if (found) return found;
  if (s.day >= s.nextEventDay) return { reason: '日常突發事件', tag: null };
  return null;
}

// 把外部（AI）資料整理成安全的事件物件；格式不對就回傳 null
const EFFECT_KEY_MAP = { stamina: 'stamina', intelligence: 'int', int: 'int', strength: 'str', str: 'str', charm: 'cha', cha: 'cha', weight: 'weight', gold: 'gold', mood: 'mood' };
const EFFECT_RANGE = { stamina: [-30, 30], int: [-5, 10], str: [-5, 10], cha: [-5, 10], weight: [-6, 8], gold: [-60, 90], mood: [-25, 25] };
function sanitizeEffects(raw) {
  const out = {};
  if (!raw || typeof raw !== 'object') return out;
  for (const [k, v] of Object.entries(raw)) {
    const key = EFFECT_KEY_MAP[k];
    const n = Math.round(Number(v));
    if (!key || !Number.isFinite(n)) continue;
    out[key] = clamp(n, EFFECT_RANGE[key][0], EFFECT_RANGE[key][1]);
  }
  return out;
}
function sanitizeEvent(obj) {
  if (!obj || typeof obj !== 'object') return null;
  const str = (v, max) => (typeof v === 'string' ? v.trim().slice(0, max) : '');
  const title = str(obj.title, 24), story = str(obj.story, 400);
  if (!title || !story || !Array.isArray(obj.choices) || obj.choices.length < 2) return null;
  const choices = [];
  for (const c of obj.choices.slice(0, 2)) {
    if (!c) return null;
    const text = str(c.text, 60), result = str(c.result, 300);
    if (!text || !result) return null;
    choices.push({ text, result, effects: sanitizeEffects(c.effects) });
  }
  return { title, emoji: str(obj.emoji, 4) || '📮', story, choices };
}

// 解析 AI 回傳（容忍 ```json 包裹或前後多餘文字）
function parseJsonLoose(text) {
  if (typeof text !== 'string') throw new Error('not text');
  let t = text.trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a < 0 || b <= a) throw new Error('no json');
  return JSON.parse(t.slice(a, b + 1));
}

// 在地備用事件：優先挑符合觸發原因標籤、且最近沒出現過的
function pickLocalEvent(s, tag) {
  if (s.mode === 'daily' && Array.isArray(s.dailyEventOrder) && s.dailyEventOrder.length) {
    const wanted = s.dailyEventOrder[(s.dailyEventIndex - 1 + s.dailyEventOrder.length) % s.dailyEventOrder.length];
    const fixed = LOCAL_EVENTS.find(e => e.title === wanted);
    if (fixed) return JSON.parse(JSON.stringify(fixed));
  }
  const seenRecently = new Set(recentEventTitles());
  const fresh = LOCAL_EVENTS.filter(e => !s.eventTitles.includes(e.title) && !seenRecently.has(e.title));
  const thisRunFresh = LOCAL_EVENTS.filter(e => !s.eventTitles.includes(e.title));
  const pool = fresh.length ? fresh : (thisRunFresh.length ? thisRunFresh : LOCAL_EVENTS);
  const tagged = tag ? pool.filter(e => e.tag === tag) : [];
  // 個性偏好：沒有指定標籤時，有 55% 機率優先抽到符合個性主題的事件
  const affinity = getPersonality(s).eventAffinity || [];
  if (!tagged.length && affinity.length) {
    const preferred = pool.filter(e => affinity.includes(e.tag));
    if (preferred.length && randomFor(s) < 0.55) return JSON.parse(JSON.stringify(pick(preferred, s)));
  }
  return JSON.parse(JSON.stringify(pick(tagged.length ? tagged : pool)));
}

// 豬豬外觀判定（給 SVG 用）
function getMood(s) {
  if (s.sickDays > 0 || s.stamina <= 10) return 'sick';
  if (s.stamina <= 35) return 'tired';
  if (s.stamina >= 65) return 'happy';
  return 'normal';
}
function getLook(s) {
  const legend = Math.min(s.int, s.str, s.cha) >= OMNI_MIN;
  const sx = s.weight < 25 ? 0.9 : clamp(1 + (s.weight - 30) / 80, 0.9, 1.75);
  let hat = null;
  if (legend) hat = 'crown';
  else if (s.int >= 60 && s.int >= s.str) hat = 'mortar';
  else if (s.str >= 60) hat = 'helmet';
  let eyewear = null;
  if (s.cha >= 60 && s.cha >= s.int) eyewear = 'shades';
  else if (s.int >= 35) eyewear = 'glasses';
  return { legend, sx, sy: 1 + (sx - 1) * 0.13, hat, eyewear, bow: s.cha >= 35, sword: s.str >= 35, sparkle: s.cha >= 60 };
}
function getPigTitle(s) {
  if (Math.min(s.int, s.str, s.cha) >= OMNI_MIN) return '傳說級全能豬';

    const patterns = {

// 天氣粒子：下雨＝雨滴、微風＝飄動的葉子（純外觀）
function buildWxLayer(key) {
  const g = document.querySelector('#pigSvg .wxLayer'), NS = 'http://www.w3.org/2000/svg';
  if (!g) return;
  g.textContent = '';
  const mk = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };
  if (key === 'rainy') {
    for (let i = 0; i < 26; i++) {
      const x = Math.random() * 350 - 15;
      const d = mk('line', { x1: x.toFixed(1), y1: 0, x2: (x - 5).toFixed(1), y2: 14, stroke: '#cfe8ff', 'stroke-width': 1.4, 'stroke-linecap': 'round', opacity: '.75', class: 'wx-drop' });
      d.style.animationDuration = (0.75 + Math.random() * 0.35).toFixed(2) + 's';
      d.style.animationDelay = '-' + (Math.random() * 1.2).toFixed(2) + 's';
      g.appendChild(d);
    }
  } else if (key === 'windy') {
    for (let i = 0; i < 9; i++) {
      // 外層 <g> 負責高度，內層葉子負責動畫（CSS 動畫的 transform 會蓋掉同一個元素上的 transform 屬性）
      const row = mk('g', { transform: `translate(0 ${(40 + Math.random() * 230).toFixed(0)})` });
      const leaf = mk('path', { d: 'M0 0 q4 -6 8 0 q-4 6 -8 0z', fill: i % 3 ? '#7fc65a' : '#e9a23b', opacity: '.9', class: 'wx-leaf' });
      leaf.style.animationDuration = (5 + Math.random() * 4).toFixed(1) + 's';
      leaf.style.animationDelay = '-' + (Math.random() * 8).toFixed(1) + 's';
      row.appendChild(leaf);
      g.appendChild(row);
    }
  }
}
function renderWeather() {
  const key = WEATHER[state.weather] ? state.weather : 'cloudy';
  const w = WEATHER[key];
  $('weatherNum').textContent = `${w.emoji} ${w.name}`;
  $('weatherBadge').title = w.tip;
  const svg = $('pigSvg');
  if (svg.dataset.wx !== key) { svg.dataset.wx = key; buildWxLayer(key); }

function flash(real) {

    row.classList.add('show');
  }
}

// ---------- 每日流程 ----------
async function onAction(id) {
  if (busyFlag || state.ended || state.pendingEvent) return;
  const baseAction = ACTIONS.find(x => x.id === id);
  if (isWeatherBlocked(baseAction, state.weather)) { toast('下雨天泥地太滑，健身房今天休館！'); return; }
  const a = weatherAction(baseAction, state.weather);
  if (!canAfford(state, a)) { toast('豬豬幣不夠囉！先去打工吧'); return; }
  if (willCollapse(state, a)) {
    const ok = await confirmBox('⚠️ 體力快撐不住了', '做完這個行動，體力會歸零，豬豬會<b>昏倒住院 2 天</b>並扣醫藥費。<br>確定要硬撐嗎？', '硬撐！', '我再想想');
    if (!ok) return;
  }
  setBusy(true);
  const dayDone = state.day;
  const wasSick = state.sickDays > 0;
  const before = { int: state.int, str: state.str, cha: state.cha };
  const { real, weak, lowMood } = runAction(state, a);
  adjustRelationships(state, ACTION_RELATIONS[id]);
  if (wasSick) state.sickDays = Math.max(0, state.sickDays - 1);
  state.noSleepStreak = id === 'sleep' ? 0 : (state.noSleepStreak || 0) + 1;
  state.bestNoSleepStreak = Math.max(state.bestNoSleepStreak || 0, state.noSleepStreak);
  feedback(RICH_SFX[id] ? id : 'action');
  if (a.main && real[a.main] > 0) feedback('growth');
  checkMilestones(before);
  if (state.weather === 'sunny' && id === 'work') addLog('☀️ 晴天加成：打工額外賺到 20G！', 'ev');
  if (state.weather === 'rainy' && id !== 'gym') addLog('🌧️ 雨聲滴答作響，泥巴健身房今天休館。', 'ev');

  const flavor = pick(FLAVOR[a.id], state);
  addLog(`${a.emoji} ${flavor}${weak && !lowMood ? '（身體虛弱，成效打七折）' : ''}${lowMood ? '（心情低落，成長打折）' : ''}`);
  if (state.sameActionStreak >= 2) addLog(`😮‍💨 連續做同一件事第 ${state.sameActionStreak} 天，有點膩了，心情下降。`, 'ev');
  else addLog('🌈 換個行程試試，豬豬覺得新鮮又開心！', 'ev');
  flash(real);
  say(flavor.length > 16 ? flavor.slice(0, 16) + '…' : flavor);

  let nextDay = dayDone + 1;
  let hosp = null;
  if (state.stamina <= 0) {
    hosp = hospitalize(state);
    feedback('collapse');
    nextDay = dayDone + 3;     // 當天昏倒 + 住院 2 天
    addLog(`🏥 體力歸零昏倒！住院休息 2 天，醫藥費 ${hosp.fee}G。`, 'bad');
  }
  state.day = nextDay;
  if (state.day <= TOTAL_DAYS) {
    state.weather = rollWeather(state);
    if (!state.weatherSeen.includes(state.weather)) state.weatherSeen.push(state.weather);
  }
  save();
  renderAll();

  if (hosp) {
    await new Promise(res => showModal({
      title: '🏥 昏倒住院！',
      html: `<div class="big">🤒</div><p>豬豬體力歸零，被緊急送進牧場醫院。<br>強制休息 <b>2 天</b>，支付醫藥費 <b>${hosp.fee}G</b>。</p><p class="small">出院後體力恢復到 60，但身體還很虛弱，下次行動成效打七折。</p>`,
      buttons: [{ text: '好吧…乖乖休息', cls: 'center primary', onClick: () => { closeModal(); res(); } }],
    }));
  }

  if (state.day > TOTAL_DAYS) { setBusy(false); await finishGame(); return; }

  const trig = checkEventTrigger(state);
  if (trig) {
    const span = getPersonality(state).eventInterval || [3, 4];
    state.nextEventDay = state.mode === 'daily' ? state.day + 3 : state.day + rand(span[0], span[1], state);
    save();
    await runEvent(trig);
  }
  setBusy(false);
  save();
  renderAll();
  say(pick({ happy: ['今天心情超好！', '哼哼～再來一份松露！', '我感覺自己無所不能！'], normal: ['今天要做什麼呢？', '準備好了，老闆！', '努力成為傳奇豬！'], tired: ['好累喔…想睡覺…', '腳軟軟的…', '讓我休息一下嘛…'], sick: ['頭暈暈的…', '我覺得…不太舒服…', '需要補充體力…'] }[getMood(state)], state));
}

// ---------- Gemini ----------
async function callGemini(prompt) {
  const key = getKey();
  if (!key) throw new Error('NO_KEY');
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;
  const contents = [{ role: 'user', parts: [{ text: prompt }] }];
  // 第一組設定關閉思考以加快速度；若被拒絕（400）就退回最簡設定
  const bodies = [
    { contents, generationConfig: { responseMimeType: 'application/json', temperature: 1, maxOutputTokens: 1200, thinkingConfig: { thinkingBudget: 0 } } },
    { contents, generationConfig: { responseMimeType: 'application/json', temperature: 1 } },
  ];
  let lastErr = new Error('unknown');
  for (let i = 0; i < bodies.length; i++) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 25000);
    try {
      const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key }, body: JSON.stringify(bodies[i]), signal: ctrl.signal });
      if (!r.ok) {
        lastErr = new Error('HTTP ' + r.status);
        if (r.status === 400 && i < bodies.length - 1) continue;
        throw lastErr;
      }
      const data = await r.json();
      const text = (data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts || []).map(p => p.text || '').join('');
      if (!text) throw new Error('EMPTY');
      return text;
    } finally { clearTimeout(timer); }
  }
  throw lastErr;
}

}
function aiFail(e) {

}

目前狀態：${stateBrief(state)}。
觸發原因：${trig.reason}。
最近發生過的事件（請避免重複）：${state.eventTitles.slice(-5).join('、') || '無'}。
請依這隻小豬目前的數值特色，寫一個「突發事件」，語氣幽默溫暖，使用繁體中文（台灣用語），事件要與目前的數值或觸發原因有關。
只回傳純 JSON，不要 markdown、不要任何說明文字，格式如下：
{"title":"事件標題(12字內)","emoji":"一個emoji","story":"事件描述，60~100字","choices":[{"text":"選項文字(20字內)","result":"選擇後的結果描述，40~70字","effects":{"stamina":0,"intelligence":0,"strength":0,"charm":0,"weight":0,"gold":0}},{"text":"...","result":"...","effects":{"stamina":0,"intelligence":0,"strength":0,"charm":0,"weight":0,"gold":0}}]}
數值規則（整數）：stamina 在 -25~25；intelligence、strength、charm 在 -4~8；weight 在 -4~5（公斤）；gold 在 -50~80。兩個選項要有取捨（例如一個賺錢、一個提升能力），不要兩個都是好處。`;
      const ev = sanitizeEvent(parseJsonLoose(await callGemini(prompt)));
      if (ev) { ev.source = 'ai'; return ev; }
      throw new Error('BAD_EVENT');
    } catch (e) { aiFail(e); }
  }
  const ev = pickLocalEvent(state, trig.tag);
  ev.source = 'local';
  return ev;
}

          if (c.requires && (Number(state.relationships && state.relationships[c.requires.npc]) || 0) < c.requires.min) { toast(`${RELATION_NAMES[c.requires.npc] || 'NPC'} 好感度需達 ${c.requires.min} 才能選這個選項`); return; }
          const before = { int: state.int, str: state.str, cha: state.cha };
          const real = applyDelta(state, PigPersonalities.scaleEventEffects(getPersonality(state), c.effects));
          adjustRelationships(state, c.relationship);
          if (state.stamina < 1) { real.stamina = (real.stamina || 0) + (1 - state.stamina); state.stamina = 1; }
          state.eventTitles.push(ev.title);
          if (state.eventTitles.length > 40) state.eventTitles.shift();
          if (ev.source === 'local') rememberEventTitle(ev.title);
          const net = (real.int || 0) + (real.str || 0) + (real.cha || 0) + (real.gold || 0) / 10 + (real.stamina || 0) / 10;
          feedback(net >= 0 ? 'good' : 'bad');
          checkMilestones(before);
          if (ev.source === 'ai') state.aiEvents++;
          addLog(`${ev.emoji} 【${ev.title}】${c.text}`, 'ev');
          save(); renderAll(); flash(real);
          m.body.innerHTML = `<div class="big">${esc(ev.emoji)}</div><p><b>你選擇了：</b>${esc(c.text)}</p><p>${esc(c.result)}</p><div class="sumrow">${chipsHtml(real) || '<span>沒有數值變化</span>'}</div>`;
          m.bar.innerHTML = '';
          const ok = document.createElement('button');
          ok.className = 'mbtn center primary'; ok.textContent = '繼續冒險 ▶';
          ok.addEventListener('click', () => { closeModal(); resolve(); });
          m.bar.appendChild(ok);
        },
      })),
    });
  });
}

// ---------- 排行榜資料 ----------
function loadLocalBoard() { try { const a = JSON.parse(localStorage.getItem(LB_KEY)); return Array.isArray(a) ? a : []; } catch (e) { return []; } }
function saveLocalBoard(a) { try { localStorage.setItem(LB_KEY, JSON.stringify(a)); } catch (e) { /* 忽略 */ } }
function getPlayerName() { try { return cleanName(localStorage.getItem(NAME_KEY) || ''); } catch (e) { return ''; } }
function setPlayerName(n) { try { localStorage.setItem(NAME_KEY, n); } catch (e) { /* 忽略 */ } }
function getDeviceId() {
  try {
    let id = localStorage.getItem(DEVICE_KEY);
    if (!id || !/^[A-Za-z0-9_-]{16,64}$/.test(id)) {
      const b = new Uint8Array(18); crypto.getRandomValues(b);
      id = Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
      localStorage.setItem(DEVICE_KEY, id);
    }
    return id;
  } catch (e) { return null; }
}
// 把這局成績記進本機排行榜（只留前 30 名），回傳這局的名次
function addLocalScore(entry) {
  const board = loadLocalBoard();
  board.push(entry);
  board.sort((a, b) => b.score - a.score || a.at - b.at);
  if (board.length > 30) board.length = 30;
  saveLocalBoard(board);
  const i = board.findIndex(x => x.id === entry.id);
  return i < 0 ? null : i + 1;
}
function localRankOf(id) { const i = loadLocalBoard().findIndex(x => x.id === id); return i < 0 ? null : i + 1; }
function renameLocalRun(id, name) {
  const board = loadLocalBoard(), x = board.find(r => r.id === id);
  if (x) { x.name = name; saveLocalBoard(board); }
}

// ---------- 線上排行榜 ----------
async function lbFetch(path, opt) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 12000);
  try {
    const r = await fetch(LB_URL + path, Object.assign({ signal: ctrl.signal }, opt));
    let data = null;
    try { data = await r.json(); } catch (e) { /* 非 JSON */ }
    if (!r.ok) throw new Error((data && data.error) || ('HTTP ' + r.status));
    return data;
  } catch (e) {
    if (e.name === 'AbortError') throw new Error('連線逾時');
    throw e;
  } finally { clearTimeout(timer); }
}
const fetchOnlineBoard = (tab = 'online', date = utcToday()) => tab === 'daily'
  ? lbFetch(`/api/daily-scores?date=${encodeURIComponent(date)}&limit=50`)
  : lbFetch('/api/scores?limit=50');
function submitOnline(name) {
  const id = getDeviceId();
  if (!id) return Promise.reject(new Error('無法取得裝置代碼（瀏覽器禁止儲存資料）'));
  const s = state;
  const daily = s.mode === 'daily';
  return lbFetch(daily ? '/api/daily-scores' : '/api/scores', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ deviceId: id, name, ...(daily ? { date: s.challengeDate } : {}), stats: { int: s.int, str: s.str, cha: s.cha, weight: s.weight, gold: s.gold, endingId: s.endingId } }),
  });
}

// ---------- 結局 ----------
async function finishGame() {
  const e = pickEnding(state);
  state.ended = true; state.endingId = e.id;
  const book = loadBook();
  const first = !book[e.id];
  if (state.mode !== 'daily') {
    const pb = loadPersonaBook();
    const key = PigPersonalities.has(state.personality) ? state.personality : DEFAULT_PERSONALITY;
    pb[key] = { count: ((pb[key] && pb[key].count) || 0) + 1, last: new Date().toISOString() };
    savePersonaBook(pb);
    state.personalityCleared = Object.keys(pb).filter(id => PigPersonalities.has(id)).length;
  }
  state.newAchievements = state.mode === 'daily' ? [] : unlockAchievements(state);
  state.permanentBonus = getAchievementMeta().bonuses;
  if (first) feedback('ending');
  if (state.newAchievements.length) feedback('achievement');
  book[e.id] = { count: ((book[e.id] && book[e.id].count) || 0) + 1, last: new Date().toISOString(), best: { int: state.int, str: state.str, cha: state.cha, weight: state.weight, gold: state.gold } };
  saveBook(book);
  state.firstUnlock = first;
  // 計分並記入本機排行榜
  const sc = calcScore(state, e);
  state.score = sc;
  state.runId = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  state.uploaded = null;
  addLocalScore({ id: state.runId, name: getPlayerName() || '無名豬豬', score: sc.total, endingId: e.id, int: state.int, str: state.str, cha: state.cha, weight: state.weight, gold: state.gold, at: Date.now() });
  save(); renderAll();
  await showEnding();
}

// ---------- 排行榜畫面 ----------
function lbRows(list, mark) {
  if (!list.length) return '<div class="lb-empty">還沒有任何成績，快去通關一次吧！🐷</div>';
  const medal = r => (r === 1 ? '🥇' : r === 2 ? '🥈' : r === 3 ? '🥉' : r);
  return `<table class="lb"><thead><tr><th>名次</th><th>豬豬</th><th class="r">分數</th></tr></thead><tbody>${list.map((x, i) => {
    const e = ENDINGS.find(t => t.id === x.endingId);
    const rank = x.rank || i + 1;
    return `<tr class="${mark && mark === x.id ? 'me' : ''}"><td class="rk">${medal(rank)}</td>
      <td class="nm">${esc(x.name)}<span class="sub">${e ? e.emoji + ' ' + esc(e.title) : ''}｜智${x.int} 力${x.str} 魅${x.cha}｜${x.weight}kg｜${x.gold}G</span></td>
      <td class="r"><b>${x.score}</b></td></tr>`;
  }).join('')}</tbody></table>`;
}
function showLeaderboard(fromEnding = false, tab) {
  tab = tab || (LB_URL ? 'online' : 'local');
  const boardDate = state && state.mode === 'daily' && state.challengeDate ? state.challengeDate : utcToday();
  const m = showModal({
    wide: true, dismiss: !fromEnding, row: true,
    title: '🏆 豬豬排行榜',
    html: `<div class="tabs"><button class="tab ${tab === 'local' ? 'on' : ''}" data-t="local">📱 本機</button><button class="tab ${tab === 'online' ? 'on' : ''}" data-t="online">🌐 總榜</button><button class="tab ${tab === 'daily' ? 'on' : ''}" data-t="daily">📅 每日榜</button></div>
      <div id="lbBody"></div>
      <p class="small" style="text-align:center">${tab === 'daily' ? `每日榜日期：${boardDate} UTC（每台裝置保留當日最佳）<br>` : ''}分數 ＝ 智慧＋力量＋魅力 ＋ 豬豬幣÷10（最多 100）＋ 結局稀有度（每顆星 40，隱藏結局再 +50）</p>`,
    buttons: [{ text: fromEnding ? '← 回到結局' : '關閉', cls: 'center primary', onClick: () => { if (fromEnding && state.ended) showEnding(); else closeModal(); } }],
  });
  m.body.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => showLeaderboard(fromEnding, b.dataset.t)));
  const box = m.body.querySelector('#lbBody');

  if (!LB_URL) { box.innerHTML = '<div class="lb-empty">這個版本還沒有設定線上排行榜。<br><span class="small">管理員部署好排行榜伺服器後，在 config.js 填入網址即可開啟。</span></div>'; return; }
  box.innerHTML = '<div class="spinner"></div>';
  fetchOnlineBoard(tab, boardDate).then(d => {

    box.innerHTML = `<div class="lb-empty">讀取失敗：${esc(err.message)}<br><span class="small">請檢查網路後再試。</span></div>`;
  });

  if (a.id === 'all_weather') return `遇見 ${new Set(s.weatherSeen || []).size} / ${Object.keys(WEATHER).length} 種天氣`;

  if (a.id === 'rich_pig') return `目前 ${s.gold} / 300G`;

      <p class="small">填入後，突發事件與結局報導會由 <code>${MODEL}</code> 即時生成；不填則使用內建內容。金鑰只會存在這台裝置的瀏覽器，並直接傳送給 Google。<br>
      取得方式：<a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a></p>
      <input class="field" id="keyInput" type="password" autocomplete="off" placeholder="${hasKey ? '已設定（輸入新值可覆蓋）' : '貼上你的 API Key'}">
      ${iosHint}
      <p class="small">目前狀態：${hasKey ? '✅ 已設定 API Key' : '⚪ 尚未設定（使用內建事件）'}</p>
      <hr><p><b>回饋設定</b></p>
      <label class="small"><input id="soundToggle" type="checkbox" ${settingEnabled(SOUND_KEY) ? 'checked' : ''}> 啟用 Web Audio 音效</label><br>
      <label class="small"><input id="hapticToggle" type="checkbox" ${settingEnabled(HAPTIC_KEY) ? 'checked' : ''}> 啟用手機震動回饋（裝置支援時）</label>
      <hr><p><b>存檔轉移</b></p>
      <p class="small">匯出會包含一般養成、每日挑戰、結局圖鑑、永久成就、個性收集與事件紀錄。Gemini API Key、暱稱與裝置識別碼不會被匯出。</p>
      <div class="modal-btns row" style="margin-top:6px"><button class="mbtn center" id="exportSaveBtn" type="button">⬇️ 匯出存檔</button><button class="mbtn center" id="importSaveBtn" type="button">⬆️ 匯入存檔</button></div>
      <input id="importSaveInput" type="file" accept=".json,application/json" hidden>`,
    buttons: [
      { text: '💾 儲存', cls: 'center primary', onClick: () => {
        const v = $('keyInput').value.trim();
        if (v) { try { localStorage.setItem(API_KEY_STORE, v); } catch (e) { /* 忽略 */ } aiWarned = false; toast('已儲存 API Key'); }
        closeModal();
      } },
      { text: '🗑️ 清除 Key', cls: 'center', onClick: () => { try { localStorage.removeItem(API_KEY_STORE); } catch (e) { /* 忽略 */ } toast('已清除 API Key'); closeModal(); } },
      { text: '關閉', cls: 'center', onClick: closeModal },
    ],
  });
  m.body.querySelector('#soundToggle').addEventListener('change', e => { try { localStorage.setItem(SOUND_KEY, e.target.checked ? '1' : '0'); } catch (err) {} refreshSoundBtn(); toast(e.target.checked ? '音效已開啟' : '音效已關閉'); });
  m.body.querySelector('#hapticToggle').addEventListener('change', e => { try { localStorage.setItem(HAPTIC_KEY, e.target.checked ? '1' : '0'); } catch (err) {} toast(e.target.checked ? '觸覺回饋已開啟' : '觸覺回饋已關閉'); });
  m.body.querySelector('#exportSaveBtn').addEventListener('click', downloadSaveTransfer);
  const importInput = m.body.querySelector('#importSaveInput');
  m.body.querySelector('#importSaveBtn').addEventListener('click', () => importInput.click());
  importInput.addEventListener('change', async () => {
    try { await importSaveFile(importInput.files && importInput.files[0]); }
    catch (e) { toast(`匯入失敗：${e.message || '檔案格式不正確'}`, 3600); }
    importInput.value = '';
  });
  return m;
}
async function resolveDailyChallenge() {
  const fallbackDate = utcToday();
  if (LB_URL) {
    try {
      const remote = await lbFetch('/api/daily-challenge');
      if (remote && typeof remote.date === 'string' && Number.isInteger(remote.seed) && remote.rulesVersion === PigCore.DAILY_RULES_VERSION) return remote;
    } catch (e) { toast('每日挑戰伺服器暫時無法連線，改用本機 UTC 種子。', 3200); }
  }
  return { date: fallbackDate, seed: PigCore.dailySeed(fallbackDate), rulesVersion: PigCore.DAILY_RULES_VERSION };
}
async function startDailyChallenge() {
  if (busyFlag) return;
  const challenge = await resolveDailyChallenge();
  if (!challenge || !challenge.seed) { toast('無法取得今日挑戰種子'); return; }
  const saved = loadState(DAILY_SAVE_KEY);
  state = saved && saved.mode === 'daily' && saved.challengeDate === challenge.date && !saved.ended
    ? saved
    : newState({ mode: 'daily', challengeDate: challenge.date, seed: challenge.seed });
  save(); closeModal(); renderAll(); say('今日每日挑戰，全球同一個固定事件順序！'); showIntro('daily');
}
function startNormalChallenge() {
  return startNormal();
}
async function startNormal() {
  if (busyFlag) return;
  const saved = loadState(SAVE_KEY);
  if (saved && !saved.ended) {
    state = saved;
    if (!PigPersonalities.has(state.personality)) {
      state.personality = DEFAULT_PERSONALITY;
      toast('舊存檔已套用預設個性「平凡小豬」，按「🔄 重來」即可重新選擇。', 3800);
    }
    save(); closeModal(); renderAll(); say('一般養成，照你的節奏慢慢培育！');
    showIntro('normal');
    return;
  }
  if (saved && saved.ended) {
    state = saved; save(); closeModal(); renderAll();
    await showEnding();
    return;
  }
  const id = await pickPersonality({ firstRun: true });
  if (!id) return;
  state = newState({ personality: id });
  save(); closeModal(); renderAll();
  say(`${getPersonality(state).name}的豬生，開始！`);
  showIntro('normal');
}
function showIntro(mode = (state && state.mode) || 'normal') {
  const daily = mode === 'daily';
  const p = getPersonality(state);
  showModal({
    row: true, title: daily ? '📅 每日固定挑戰' : '🐷 歡迎來到豬豬夢工場！',
    html: `<div class="big">🌾🐖🌾</div>
      <p>你有 <b>30 天</b>，要把這隻普通的小粉豬養成<b>獨當一面的傳奇豬豬</b>！</p>
      <p>每天選 <b>1 個行動</b>：讀書、健身、練儀態、大吃大喝、打工，或睡覺回血。體力歸零會昏倒住院，記得量力而為。</p>
      <p>途中會遇到<b>突發事件</b>，你的選擇會影響數值。第 30 天結束後，依最終數值解鎖專屬結局與報紙頭條！</p>
      ${daily ? '' : `<p class="scorebox">${p.emoji} 本局個性：${esc(p.name)}<small>${esc(p.tagline)}｜${esc(p.pros.join('、'))}</small></p>`}
      <p class="small">🏆 一共有 ${ENDINGS.length} 種結局等你收集。內建事件共 ${LOCAL_EVENTS.length} 則；每天的天氣可能改變行程選擇與收益。</p>
      ${daily ? `<p class="scorebox">🌍 ${state.challengeDate} UTC 固定挑戰<small>每日種子、天氣、能力成長與事件順序固定；不套用永久成就加成，個性固定為「標準豬豬」。事件固定使用內建內容，不受玩家 API Key 影響。</small></p>` : `<p class="small">🏅 永久加成：智慧 +${getAchievementMeta().bonuses.int}、力量 +${getAchievementMeta().bonuses.str}、魅力 +${getAchievementMeta().bonuses.cha}。解鎖成就後，下一局就能帶著加成出發！</p>`}`,
    buttons: [{ text: daily ? '開始今日挑戰 ▶' : '開始一般養成 ▶', cls: 'center primary', onClick: () => { closeModal(); say(daily ? '固定事件順序已鎖定，開始每日挑戰！' : '今天要做什麼呢？'); } }, { text: daily ? '🌱 切回一般養成' : '📅 改玩每日挑戰', cls: 'center', onClick: () => daily ? startNormalChallenge() : startDailyChallenge() }],
  });
}
async function restart() {
  if (busyFlag) return;
  if (!state.ended) {
    const ok = await confirmBox('🔄 重新開始？', '目前的養成進度會消失，但<b>結局圖鑑與永久成就加成</b>會保留。', '重新開始', '取消');
    if (!ok) return;
  }
  if (state.mode === 'daily') {
    state = newState({ mode: 'daily', challengeDate: state.challengeDate, seed: state.seed });
  } else {
    const id = await pickPersonality({ current: state.personality, allowCancel: true });
    if (!id) return;
    state = newState({ personality: id });
  }
  save(); setBusy(false); closeModal(); renderAll(); say('新的豬生，開始囉！'); showIntro(state.mode);
}

// ---------- 啟動 ----------
async function init() {
  state = loadState();
  buildStats();
  if (!state) {
    const id = await pickPersonality({ firstRun: true });
    state = newState({ personality: id || DEFAULT_PERSONALITY });
    save();
  } else if (!PigPersonalities.has(state.personality)) {
    // 舊版存檔：第 1 天還沒動作就讓玩家選；進行中的局則套用預設值，避免中途改變平衡
    if (state.mode !== 'daily' && !state.ended && state.day === 1 && state.log.length === 0) {
      const id = await pickPersonality({ firstRun: true });
      state = newState({ personality: id || DEFAULT_PERSONALITY });
      save();
    } else {
      state.personality = DEFAULT_PERSONALITY;
      save();
    }
  }
  renderAll();
  refreshSoundBtn();
  $('btnSound').addEventListener('click', () => {
    const on = !settingEnabled(SOUND_KEY);
    try { localStorage.setItem(SOUND_KEY, on ? '1' : '0'); } catch (err) { /* 忽略 */ }
    refreshSoundBtn();
    if (on) feedback('action');
    toast(on ? '音效已開啟' : '音效已關閉', 1400);
  });
  $('btnRank').addEventListener('click', () => showLeaderboard(false));
  $('btnDaily').addEventListener('click', startDailyChallenge);
  $('btnCasual').addEventListener('click', startNormalChallenge);
  $('btnShop').addEventListener('click', showShop);
  $('btnBook').addEventListener('click', () => showBook(false));
  $('btnAchievements').addEventListener('click', () => showAchievements(false));
  $('btnSettings').addEventListener('click', showSettings);
  $('btnRestart').addEventListener('click', restart);
  const persBadge = $('persBadge');
  if (persBadge) {
    persBadge.addEventListener('click', showPersonalityInfo);
    persBadge.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showPersonalityInfo(); } });
  }
  $('btnInstall').addEventListener('click', async () => {
    if (!deferredInstall) return;
    deferredInstall.prompt();
    try { await deferredInstall.userChoice; } catch (e) { /* 忽略 */ }
    deferredInstall = null; $('btnInstall').hidden = true;
  });
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; $('btnInstall').hidden = false; });
  window.addEventListener('appinstalled', () => { $('btnInstall').hidden = true; toast('已加到主畫面 🎉'); });

  if (state.ended) { setBusy(true); await showEnding(); setBusy(false); return; }
  if (state.pendingEvent) {          // 事件進行到一半就關掉頁面時，接續顯示
    setBusy(true);
    await presentEvent(state.pendingEvent);
    state.pendingEvent = null; save(); setBusy(false); renderAll();
    return;
  }
  if (state.day === 1 && state.log.length === 0) showIntro(state.mode);
}

function showUpdatePrompt(registration) {
  if (document.getElementById('updatePrompt')) return;
  const prompt = document.createElement('div');
  prompt.className = 'update-prompt'; prompt.id = 'updatePrompt'; prompt.setAttribute('role', 'status');
  prompt.innerHTML = '<span>🎉 有新版本可以使用！</span><button type="button">點此更新</button>';
  prompt.querySelector('button').addEventListener('click', () => {
    const waiting = registration.waiting;
    if (!waiting) { location.reload(); return; }
    waiting.postMessage({ type: 'SKIP_WAITING' });
  });
  document.body.appendChild(prompt);
}
function setupServiceWorkerUpdates() {
  if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || reloading) return;
    reloading = true;
    window.location.reload();
  });
  window.addEventListener('load', async () => {
    try {
      const registration = await navigator.serviceWorker.register('./sw.js');
      const watchInstalling = worker => {
        if (!worker) return;
        worker.addEventListener('statechange', () => {
          if (worker.state === 'installed' && navigator.serviceWorker.controller) showUpdatePrompt(registration);
        });
      };
      if (registration.waiting && navigator.serviceWorker.controller) showUpdatePrompt(registration);
      registration.addEventListener('updatefound', () => watchInstalling(registration.installing));
      registration.update().catch(() => { /* 網路暫時不可用時，沿用目前版本 */ });
      setInterval(() => registration.update().catch(() => {}), 60 * 60 * 1000);
    } catch (e) { /* 離線功能失敗不影響遊玩 */ }
  });
}
setupServiceWorkerUpdates();
init();
</script>
